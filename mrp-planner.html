    --brand-green-1000: #16200a;
    --brand-orange-600: #e98b3e;  /* secondary */

    --ground: #ffffff;
    --surface: #ffffff;
    --surface-2: #f5f6f0;
    --ink: #1e230f;
    --muted: #63684f;
    --faint: #8b9078;
    --line: #e2e4d8;
    --dot: #e6e8dc;
    --card-line: #eceee4;
    --drop-line: #e8eade;
    --line-strong: #c9cdba;

    --accent: var(--brand-green-800);
    --accent-soft: #edf0de;
    --on-accent: #ffffff;
    --group: #f7f7f6;

    --good: var(--brand-green-600);
    --good-soft: #edf2dc;
    --flag: #a85d16;                /* darkened Orange 600 for legible text */
    --flag-fill: var(--brand-orange-600);
    --flag-soft: #fcefe1;
    --crit: #7a1f12;
    --crit-soft: #f7e9e6;

    /* Dedicated to the two stock-cover alert cards only — brighter than the
       oxblood --crit used for exception badges elsewhere, and lighter than
       the deep brand green used for --good. Defined once, theme-independent:
       --card-red is the same coral the app already uses for --crit in dark
       mode, and --card-green is the existing lighter brand-green-400 token —
       both read cleanly against a pale tint on either background. */
    --card-red: #e0897b;
    --card-green: var(--brand-green-400);

    --shadow: 0 1px 2px rgba(30, 35, 15, .06), 0 8px 24px rgba(30, 35, 15, .08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: var(--brand-green-1000);
      --surface: #1c2011;
      --surface-2: #242918;
      --ink: #edefe2;
      --muted: #a2a78d;
      --faint: #7b8068;
      --line: #313720;
      --dot: #23281a;
      --card-line: #262c1a;
      --drop-line: #262c1a;
      --line-strong: #464d30;

      --accent: var(--brand-green-400);
      --accent-soft: #232b12;
      --on-accent: #171c08;
      --group: #191d10;

      --good: var(--brand-green-400);
      --good-soft: #1d2411;
      --flag: #eda155;
      --flag-fill: var(--brand-orange-600);
      --flag-soft: #2d2013;
      --crit: #e0897b;
      --crit-soft: #2c1713;

      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .38);
    }
  }

  :root[data-theme="dark"] {
    --ground: var(--brand-green-1000);
    --surface: #1c2011;
    --surface-2: #242918;
    --ink: #edefe2;
    --muted: #a2a78d;
    --faint: #7b8068;
    --line: #313720;
    --dot: #23281a;
    --card-line: #262c1a;
    --drop-line: #262c1a;
    --line-strong: #464d30;

    --accent: var(--brand-green-400);
    --accent-soft: #232b12;
    --on-accent: #171c08;
    --group: #191d10;

    --good: var(--brand-green-400);
    --good-soft: #1d2411;
    --flag: #eda155;
    --flag-fill: var(--brand-orange-600);
    --flag-soft: #2d2013;
    --crit: #e0897b;
    --crit-soft: #2c1713;

    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .38);
  }

  * { box-sizing: border-box; }

  /* A dot grid on the page ground only. The panels keep their solid fill on top
     of it, so the texture reads in the gutters between them and never behind a
     number. --dot is a token so dark mode can lighten it rather than invert. */
  body {
    margin: 0;
    background-color: var(--ground);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 18px 18px;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  table, .tnum, .num { font-variant-numeric: tabular-nums; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .label {
    text-transform: uppercase;
    letter-spacing: .085em;
    font-size: 10px;
    font-weight: 600;
    color: var(--faint);
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


  /* ---------- dashboard ---------- */
  .step.home .step-n { font-size: 11px; }

  .hero {
    display: grid; grid-template-columns: 1fr auto; gap: 26px; align-items: start;
    background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
    padding: 16px 18px; border-left: 3px solid var(--brand-orange-600);
  }
  .hero-t { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin-top: 3px; text-wrap: balance; }

  .mini { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; min-width: 190px; }
  .mini-i { display: grid; grid-template-columns: 9px 1fr; gap: 9px; align-items: start; }
  .mini-d { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line-strong); margin-top: 4px; }
  .mini-i.done .mini-d { background: var(--good); border-color: var(--good); }
  .mini-i.next .mini-d { background: var(--brand-orange-600); border-color: var(--brand-orange-600); box-shadow: 0 0 0 3px var(--flag-soft); }
  .mini-t { display: block; font-size: 12px; font-weight: 550; }
  .mini-s { display: block; font-size: 11px; color: var(--muted); }
  .mini-i.next .mini-s { color: var(--flag); font-weight: 600; }

  .pipe { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .pipe-i { display: grid; grid-template-columns: 9px 1fr auto auto; gap: 10px; align-items: center; padding: 6px 0; position: relative; }
  .pipe-i + .pipe-i::before { content: ""; position: absolute; left: 4px; top: -8px; height: 16px; width: 1px; background: var(--line); }
  .pipe-d { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
  .pipe-i.ok .pipe-d { background: var(--good); border-color: var(--good); }
  .pipe-i.p2 { opacity: .5; }
  .pipe-t { font-size: 12.5px; font-weight: 550; }
  .pipe-w { font-size: 11px; color: var(--muted); }

  .att { display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: start; font-size: 12px; }
  .att .muted { font-size: 11.5px; margin-top: 1px; }



  .acc-wrap { display: grid; grid-template-columns: 232px 1fr; gap: 22px; align-items: center; }
  .acc-gauge { display: flex; flex-direction: column; gap: 6px; }
  .gauge { width: 100%; max-width: 252px; height: auto; display: block; margin: 0 auto; }
  .gauge-v { font-size: 23px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
             font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .gauge-k { font-size: 8px; text-transform: uppercase; letter-spacing: .085em; font-weight: 600;
             font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .gauge-s { font-size: 8.5px; font-variant-numeric: tabular-nums;
             font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (max-width: 1180px) { .acc-wrap { grid-template-columns: 1fr; } }


  .cyclesel { display: flex; gap: 2px; background: var(--surface-2); border: 0; border-radius: 8px; padding: 3px; }
  .cyc { font: inherit; font-size: 11.5px; font-weight: 550; border: 0; background: none; color: var(--muted);
         padding: 4px 11px; border-radius: 999px; cursor: pointer; }
  .cyc:hover { color: var(--ink); }
  .cyc.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(30,35,15,.10); }
  .acc-h { padding-bottom: 3px; border-bottom: 1px solid var(--line); margin-bottom: 3px; }

  .acc { display: flex; flex-direction: column; gap: 3px; }
  .acc-r { display: grid; grid-template-columns: minmax(140px, 1.3fr) 60px 1.9fr; gap: 16px; align-items: center; padding: 5px 0; }

  .acc-mine { background: var(--accent-soft); border-radius: 6px; padding-left: 8px; padding-right: 8px; margin: 0 -8px; }

  .acc-b { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .acc-b > i { display: block; height: 100%; }


  .mapgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .mapf { display: flex; flex-direction: column; gap: 4px; }
  .mapf select { width: 100%; }
  code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }


  /* ---------- top bar + profile ---------- */
  .content { display: flex; flex-direction: column; min-width: 0; }
  .profile { position: relative; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line-strong);
    background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 16px;
    font-weight: 700; letter-spacing: .02em; cursor: pointer; display: grid; place-items: center;
    flex: none;
  }
  .avatar:hover { background: color-mix(in srgb, var(--accent) 15%, var(--surface)); }
  .avatar.sm { width: 32px; height: 32px; font-size: 11.5px; cursor: default; }
  /* Anchored to the right — the avatar sits top-right of the page, so a
     left-anchored menu would run off the right edge instead. */
  .menu {
    position: absolute; right: 0; left: auto; top: 58px; width: 272px;
    max-width: calc(100vw - 32px);
    background: var(--surface); border: 0; border-radius: 10px; box-shadow: var(--shadow);
    padding: 5px; z-index: 30;
  }
  .menu-h { display: flex; gap: 9px; align-items: center; padding: 8px 9px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .menu-i {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 12.5px;
    background: none; border: 0; border-radius: 5px; padding: 7px 9px; cursor: pointer; color: var(--ink);
  }
  .menu-i:hover { background: var(--surface-2); }

  .menu-unit { padding: 8px 9px 10px; display: flex; flex-direction: column; gap: 5px; }
  .menu-unit select { width: 100%; }
  .ro-note { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--group); border-radius: 9px; font-size: 12px; margin-bottom: 18px; }

  .menu-sep { height: 1px; background: var(--line); margin: 4px 0; }

  /* ---------- simple home ---------- */
  .btn-lg { padding: 12px 26px; font-size: 14.5px; border-radius: 999px; }


  /* Flat panel, no shadow. The tinted ground is doing the separating; a drop
     shadow on top of it lifted every category off the page and, stacked four
     deep down the dashboard, read as clutter. */
  .group {
    background: var(--group); border: 0; border-radius: 12px;
    padding: 18px; margin-top: 18px;
  }
  .group-h { margin: 2px 2px 12px; font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
  /* Token, not a hardcoded near-white. #f5f5f5 was invisible in light mode and
     a bright rule around every card in dark, which is what made the borders
     read as hard. */
  .group .card { background: var(--surface); border: 1px solid var(--card-line); }

  .simple { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }

  /* A fixed four-column track instead of auto-fit. auto-fit stretches whatever
     cards are present to fill the row, so a set of two came out half a screen
     wide while a set of three came out narrower — the same card changed size
     depending on how many siblings it had. Fixed columns keep every card one
     size across every set and leave the tail of a short row empty. */
  .simple.fixed { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 960px) { .simple.fixed { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .simple.fixed { grid-template-columns: 1fr; } }

  /* Each category is its own panel with its own ground, headed by a name and a
     plain-language subtitle. The tinted panel is what separates one set from
     the next — the cards inside stay white, so the grouping is carried by the
     background rather than by a label floating above loose cards. */
  /* Two sections sharing a row. Their card grids drop to two columns inside it
     — a four-column track in half the width would leave cards narrower than
     their own labels. */
  /* Data health as a list rather than a fourth grid of cards: three unrelated
     checks, each one line, read faster stacked than boxed — and it breaks up a
     dashboard that was otherwise cards all the way down. */
  .dh { display: flex; flex-direction: column; background: var(--surface); border-radius: 9px; overflow: hidden; }
  /* The dial leads the panel: one number, centred, at a size worth drawing. */
  .dh-top {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    width: 100%; padding: 14px 16px 15px; border: 0; border-bottom: 1px solid var(--line);
    background: none; font: inherit; color: var(--ink); text-align: center;
  }
  .dh-top .mgauge { width: 132px; margin: -4px auto 2px; }

  .dh-row {
    display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 13px;
    padding: 15px 16px; border-top: 1px solid var(--line); text-align: left;
    font: inherit; color: var(--ink); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%;
  }
  .dh-row:first-child { border-top: 0; }
  .dh-btn { cursor: pointer; }
  .dh-btn:hover { background: var(--surface-2); }
  .dh-m { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .dh-t { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .dh-s { font-size: 11px; color: var(--muted); }
  .dh-v { font-size: 17px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .dh-i { width: 46px; height: 31px; display: block; }
  .dh-b {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; margin: 0 4px;
  }
  .dh-good { background: var(--good-soft); color: var(--good); }
  .dh-flag { background: var(--flag-soft); color: var(--flag); }

  /* Five segments and a caption — enough to see progress at a glance without
     restating the stepper that already lives inside the steps. */
  .cycbar { padding: 14px 18px; }
  .cycrow { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .cycsegs { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .cycseg {
    flex: 1; height: 7px; border: 0; padding: 0; border-radius: 999px; cursor: pointer;
    background: var(--surface-2);
  }
  .cycseg:disabled { cursor: not-allowed; }
  .cycseg:hover:not(:disabled) { background: var(--line-strong); }
  .cycseg.done { background: var(--good); }
  .cycseg.cur { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .cycnow { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .cycnow b { color: var(--ink); font-weight: 600; }

  .pair { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; align-items: start; margin-top: 18px; }
  .pair .group { margin-top: 0; }
  /* The narrower column stacks its cards rather than squeezing two across, so
     it fills its side of the row instead of sitting as a short strip. */
  .pair .simple.fixed { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pair > .group:last-child .simple.fixed { grid-template-columns: 1fr; }
  .pair > .group:last-child .card { min-height: 118px; }
  @media (max-width: 1040px) { .pair { grid-template-columns: 1fr; } }

  .sec-h { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; margin: 0 2px 12px; }
  .sec-t { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .sec-s { font-size: 12px; color: var(--muted); }



  .group-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 2px 2px 12px; }
  /* The dial owns the top band alone — it is one number, so it is centred
     rather than stretched beside a list that repeats what follows. */
  .acc-top { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 2px; }
  .acc-top .gauge { width: 290px; max-width: 100%; height: auto; }

  .acc-widget { display: grid; grid-template-columns: 190px 1fr; gap: 20px; align-items: center;
                background: var(--surface); border-radius: 9px; padding: 14px 16px; }
  .acc-dial { text-align: center; }
  .acc-dial .mgauge { width: 150px; margin: 0 auto; }
  .acc-dial-s { font-size: 11.5px; margin-top: 2px; }
  @media (max-width: 900px) { .acc-widget { grid-template-columns: 1fr; } }

  .card-acc { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  /* auto margins, not the old -4px nudge — that nudge was compensating for the
     gauge sitting under a left-aligned label, and once the label was centred it
     just pulled the dial off centre. */
  /* The dial leads the card now, so it gets the room — nothing sits above it to
     crowd it, and the negative top margin pulls it up into the card's padding
     so the extra width does not push the label off the bottom. */
  .mgauge { width: 142px; height: auto; display: block; margin: -6px auto 3px; }
  /* Same dial at card-figure scale: it stands in for the number, so it takes
     roughly the space the number did rather than leading the card the way the
     forecast-accuracy dial does. */
  /* The arc sweeps in from zero. Animating the offset rather than the dash
     length keeps the rounded cap full-size the whole way round; growing the
     dash would have the cap swell as the arc extends. */
  .arc-draw { animation: arcDraw .85s cubic-bezier(.22,.75,.3,1) forwards; }
  @keyframes arcDraw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .arc-draw { animation: none; stroke-dashoffset: 0; }
  }

  /* Placeholder cards for the moment before the daily sync figures land. */
  .skl {
    border-radius: 6px;
    background: linear-gradient(90deg,
      var(--surface-2) 25%,
      color-mix(in srgb, var(--surface-2) 45%, var(--group)) 37%,
      var(--surface-2) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.5s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .skl { animation: none; } }
  .skl-t { height: 9px;  width: 58%; margin: 0 auto 11px; }
  .skl-n { height: 19px; width: 44%; margin: 0 auto 9px; }
  .skl-s { height: 8px;  width: 72%; margin: 0 auto; }

  .rgauge { width: 98px; height: auto; display: block; margin: 1px auto 0; }
  .rgauge .mgauge-v { font-size: 15px; }
  .mgauge-v { font-size: 18px; font-weight: 700; letter-spacing: -.025em; font-variant-numeric: tabular-nums;
              font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Success-metric tiles use the dashboard card's shape exactly — centred,
     label above figure — so the two card families read as one system. Only the
     status line and the optional source line are particular to these. */
  .mcard .mk { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink); }
  .mcard .mv { font-size: 18px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
               margin: 4px 0 2px; color: color-mix(in srgb, var(--ink) 80%, transparent); }
  .mcard .ms { font-size: 11px; font-weight: 550; color: var(--muted); }
  .mcard .md { font-size: 10.5px; color: var(--faint); margin-top: 6px; }
  .m-good .ms { color: var(--good); }
  .m-crit .mv, .m-crit .ms { color: var(--crit); }
  .m-flag .ms { color: var(--flag); }
  .m-none .mv { color: var(--faint); }

  .card-btn { font: inherit; text-align: left; cursor: pointer; border: 0; width: 100%; position: relative; }
  .card-btn:hover { background: var(--surface-2); }
  /* Where a clickable card used to spend a line saying "See items", it now
     shows an arrow on hover. Decorative only — the card is a <button> with its
     own text, so nothing is lost to a screen reader by the arrow being CSS. */
  .card-btn::after {
    content: "\2192"; position: absolute; right: 10px; bottom: 7px;
    font-size: 13px; line-height: 1; color: var(--accent);
    opacity: 0; transform: translateX(-3px); transition: opacity .12s ease, transform .12s ease;
  }
  .card-btn:hover::after, .card-btn:focus-visible::after { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .card-btn::after { transition: none; } }


  .qty-n { display: flex; flex-direction: column; gap: 1px; }
  .qty-n span { font-size: 14px; line-height: 1.15; }
  .qty-n span:first-child { font-size: 16px; }


  .uploads { display: flex; flex-direction: column; }
  .uprow {
    display: grid; grid-template-columns: 2.4fr 0.9fr 1.2fr 0.8fr;
    gap: 14px; align-items: center; padding: 12px 13px; text-align: left;
  }
  .uphead { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 600; }
  .cy-row { grid-template-columns: 1.6fr 1.2fr 1.4fr 1.4fr 0.8fr; }
  .cy-on { background: var(--accent-soft); }

  .ub-scroll { max-height: 358px; overflow-y: auto; }
  .ub-row { grid-template-columns: 2.4fr 1.3fr 0.7fr 0.9fr 0.8fr; }
  .ub-mine { background: var(--accent-soft); border-radius: 8px; }

  .upfile { display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; color: var(--muted); margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .upissues { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .uplink { font: inherit; background: var(--surface); border: 0; border-radius: 8px; cursor: pointer; margin-bottom: 3px; }
  .uplink:hover { background: var(--surface-2); }
  .uplink:last-child { margin-bottom: 0; }

  /* `.group .card` (0,2,0 specificity, for the card border) otherwise beats a
     bare `.card-warn`/`.card-crit`/`.card-good` (0,1,0) regardless of source
     order, so these three states were silently never rendering their fill —
     compounded onto `.card` to guarantee they win. */
  /* A tinted card carries its own edge — either the status ring below or the
     fill itself — so the neutral border is dropped rather than drawn round the
     outside of it, which was giving these cards two outlines. */
  .group .card.card-warn, .group .card.card-crit, .group .card.card-good { border-color: transparent; }

  .group .card.card-warn { background: var(--flag-soft); }

  .group .card.card-crit {
    background: color-mix(in srgb, var(--card-red) 20%, var(--surface));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--card-red) 26%, transparent);
  }
  /* .card .n (below) sets the same specificity (0,2,0) and is declared after
     this in the file, so it would otherwise win the tie and silently repaint
     these back to plain ink — compounded onto .card for a guaranteed win,
     same fix as the background rule above. */
  .card.card-crit .n, .card-crit .t { color: var(--card-red); }

  .group .card.card-good {
    background: color-mix(in srgb, var(--card-green) 20%, var(--surface));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--card-green) 26%, transparent);
  }
  .card.card-good .n, .card-good .t { color: var(--card-green); }

  /* Scoped to these cards only — a bare .pill.p-crit override would also
     repaint the review table's exception badges, which must stay as they are. */
  /* A deeper wash of the card's own status colour rather than a white chip —
     the tag sits into the card instead of on top of it, but still reads as a
     distinct object. Translucent, so it darkens whatever tint is underneath
     and needs no separate value per theme. */
  /* Solid fill, reversed-out text. --crit/--good are the deep end of each ramp,
     not the pale --card-* tints the card body uses, so the tag has real contrast
     against it. --on-accent carries the label colour because it already flips
     per theme — white on the dark light-mode fill, near-black on the light
     dark-mode one — so one rule covers both. */
  .card-crit .pill.p-crit { background: var(--crit); color: var(--on-accent); border-color: transparent; }
  .card-good .pill.p-good { background: var(--good); color: var(--on-accent); border-color: transparent; }

  .btn-icon { padding: 6px; width: 30px; height: 30px; display: inline-grid; place-items: center; }
  .btn-icon svg { width: 16px; height: 16px; }
  button.card { font: inherit; cursor: pointer; width: 100%; }
  button.card:hover { background: var(--surface-2); }
  tr.muted td { color: var(--faint); }
  /* Grid rows stretch every card to the tallest in the row, so content that is
     shorter than its neighbours sat pinned to the top with dead space beneath.
     Centring it vertically makes a row of cards read on one line. */
  /* One height for every card in every category. Grid rows only equalise cards
     within their own row, so Data health — set by the tallest card, the one
     with the gauge — was leaving the other two sections visibly shorter.
     The floor also keeps the corner pill clear of a centred label. */
  .card {
    background: var(--group); border: 0; border-radius: 9px; padding: 12px 12px; text-align: center;
    position: relative; display: flex; flex-direction: column; justify-content: center;
    min-height: 130px;
  }
  /* Scales with whatever text size it lands in — a 22px KPI figure and a 12px
     table cell both get a correctly proportioned mark, with no per-context
     overrides needed. */
  .dhs { display: inline-block; width: 0.66em; vertical-align: -0.06em; margin-right: 0.14em; }
  .dhs svg { width: 100%; height: auto; display: block; }

  .card .n { font-size: 18px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
             margin-top: 4px; color: color-mix(in srgb, var(--ink) 80%, transparent); }
  /* The label now leads the card, so it is set as a heading — uppercase and
     muted — rather than the caption weight it carried when it sat under the
     figure. Without that the two lines competed and neither read first. */
  .card .t { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink); }
  .card .s { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card .qty-line { font-variant-numeric: tabular-nums; margin-top: 1px; }
  /* The money line on Cover met, set in ink so it reads as a figure rather
     than as more supporting text. */
  .cov-band { margin-top: 3px; }
  .cov-sep { color: var(--line-strong); margin: 0 4px; }
  .cov-val { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  /* Status sits in the top-right corner, against the card's centred content.
     The row is drawn even when there is no pill to show — otherwise the one
     card without a status would pull its figure a line higher than the two
     beside it. */
  /* Taken out of the flow so it stays pinned to the corner while the rest of
     the card centres vertically — in flow it would have been centred too and
     drifted down into the figure. */
  .card-top { position: absolute; top: 8px; right: 9px; display: flex; }
  .card-top .pill { font-size: 9.5px; font-weight: 550; padding: 1px 6px; border-radius: 999px; }

  .todo { display: flex; flex-direction: column; gap: 2px; }
  .todo-i { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
  .todo-i:first-child { border-top: 0; }


  .drawer.wide { width: min(720px, 96vw); }
  .fsrc {
    width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    line-height: 1.6; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--surface-2); color: var(--ink); resize: vertical;
  }
  .fsrc:focus { border-color: var(--accent); background: var(--surface); }
  .prev { border-radius: 9px; padding: 13px 15px; border: 0; }
  .prev.ok { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 32%, transparent); }
  .prev.bad { background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 32%, transparent); }
  .prev-v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 1px; }
  input[type="text"] { font: inherit; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink); }





  .hello { display: flex; align-items: center; gap: 14px; }
  .head-actions { display: flex; align-items: center; gap: 14px; }
  /* Sticks under the top of the window, spanning main's gutters so nothing
     scrolls past it in the margins. Translucent for the same reason the page
     header is — the dot grid lives on the body and an opaque band would cut a
     clean stripe through it. */
  .stephead {
    position: sticky; top: 0; z-index: 25;
    margin: -48px -32px 0; padding: 16px 32px 2px;
    background: color-mix(in srgb, var(--ground) 80%, transparent);
  }
  @supports (backdrop-filter: blur(8px)) { .stephead { backdrop-filter: blur(8px); } }
  @supports not (backdrop-filter: blur(8px)) { .stephead { background: var(--ground); } }
  main > .stephead:first-child { margin-top: -48px; }

  .steptop { display: flex; align-items: center; gap: 12px; margin: 0 0 24px -8px; }

  /* flex-start, not center: the greeting block is two lines and the button one,
     so centring floated the button halfway down and it lined up with neither
     the title nor the date. Its top edge now meets the title's. */
  /* Sticks to the top so the greeting line and the one action stay reachable
     from anywhere down the page. Translucent with a blur rather than a solid
     fill: the dot grid lives on the body, so an opaque bar would leave a
     dot-free band across the top while the rest of the page kept its texture.
     The negative top margin must equal main's padding-top (48px) exactly — any
     less and content scrolls up into the strip of gap above the bar. */
  .pagehead {
    display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 20;
    margin: -48px 0 4px; padding: 14px 0 12px;
    background: color-mix(in srgb, var(--ground) 78%, transparent);
  }
  @supports (backdrop-filter: blur(8px)) { .pagehead { backdrop-filter: blur(8px); } }
  @supports not (backdrop-filter: blur(8px)) { .pagehead { background: var(--ground); } }
  /* Centred against the greeting block as a whole — its midpoint sits between
     the two lines, which is where the button belongs. */
  .pagehead .head-actions { margin-top: 0; }
  @media (max-width: 700px) { .pagehead .head-actions { margin-top: 4px; } }

  /* A drawn arrow rather than a "→" glyph — the glyph rendered at whatever
     weight and baseline the system font gave it, which sat low against the
     button's uppercase-height label. */
  /* The one action on the dashboard, sized and lit to say so. The halo is a
     pseudo-element rather than the button's own box-shadow, so it can pulse
     without wiping out the resting shadow that gives the button its weight. */
  .btn-cta { position: relative; padding: 23px 54px; font-size: 21px; letter-spacing: .01em; }
  .btn-cta::after {
    content: ""; position: absolute; inset: 0; border-radius: 999px; pointer-events: none;
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent);
    animation: ctaRing 2.8s ease-out infinite;
  }
  @keyframes ctaRing {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
    70%  { box-shadow: 0 0 0 19px color-mix(in srgb, var(--accent) 0%, transparent); }
    100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); }
  }
  .btn-cta:hover::after { animation: none; }
  @media (prefers-reduced-motion: reduce) { .btn-cta::after { animation: none; } }

  .btn-arrow { display: inline-flex; align-items: center; gap: 9px; }
  .btn-arrow svg { width: 17px; height: 17px; flex: none; transition: transform .15s ease; }
  .btn-cta.btn-arrow svg { width: 23px; height: 23px; }
  .step-b.btn-arrow svg { width: 17px; height: 17px; }
  .btn-arrow:hover:not(:disabled) svg { transform: translateX(3px); }
  @media (prefers-reduced-motion: reduce) { .btn-arrow svg { transition: none; } }

  .stats, .grid2, .simple { margin-top: 16px; }
  .group + .panel, .panel + .group { margin-top: 16px; }
  .greet {
    margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.02em;
  }
  .greet-e { font-size: 19px; margin-left: 2px; }
  /* Sits on the greeting line rather than in the subtitle — which plant you are
     looking at changes what every number below means, so it reads as a scope
     tag on the page, not as a detail after the date. */
  .plant-tag { font-size: 10.5px; margin-left: 7px; vertical-align: 1px; }
  .greet-s { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }

  /* ---------- circle stepper ---------- */
  /* Columns follow the number of steps rather than a fixed count — a hardcoded
     column count silently wraps the last step onto its own row when one is added. */
  .stepper {
    list-style: none; margin: 0 0 18px; padding: 0;
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr);
    gap: 0; overflow-x: auto;
  }
  .stp { position: relative; min-width: 0; }
  .stp + .stp::before {
    content: ""; position: absolute; left: -50%; right: 50%; top: 22px; height: 0;
    border-top: 2px dotted var(--line-strong); z-index: 0;
  }
  .stp.done::before, .stp.cur::before { border-top-color: var(--accent); }
  .stp-b {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
    gap: 9px; width: 100%; background: none; border: 0; font: inherit; cursor: pointer;
    padding: 0 6px; color: var(--ink);
  }
  .stp-b:disabled { cursor: not-allowed; }
  .stp-c {
    position: relative; z-index: 1;
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    border: 2px solid var(--line-strong); background: var(--surface); color: var(--muted);
    font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; transition: all .15s ease;
  }
  .stp.done .stp-c { background: var(--good); border-color: var(--good); color: var(--on-accent); }
  .stp.cur .stp-c { background: var(--accent); border-color: var(--accent); color: var(--on-accent);
                    box-shadow: 0 0 0 5px var(--accent-soft); }
  .stp.lock .stp-c { opacity: .45; }
  .stp:not(.cur):not(.done) .stp-b:hover:not(:disabled) .stp-c { background: var(--surface-2); }
  .stp.cur .stp-b:hover:not(:disabled) .stp-c { background: color-mix(in srgb, var(--accent) 86%, #000); }
  .stp.done .stp-b:hover:not(:disabled) .stp-c { background: color-mix(in srgb, var(--good) 86%, #000); }
  .stp-l { text-align: center; }
  .stp-t { display: block; font-size: 12.5px; font-weight: 600; }
  .stp-s { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .stp.lock .stp-t, .stp.lock .stp-s { opacity: .5; }
  @media (prefers-reduced-motion: reduce) { .stp-c { transition: none; } }

  /* ---------- left rail ---------- */
  /* A pill fixed to the left edge, holding the account and settings. Fixed
     rather than in the page header so it is reachable from every screen —
     previously the avatar lived in the dashboard header alone and vanished the
     moment a planner entered a step. */
  /* The rail is now two objects: a pill of page controls, and the account on
     its own below it. Separating them says what the grouping already implied —
     the pill navigates the app, the avatar is who you are. */
  .rail {
    position: fixed; left: 14px; top: 50%; transform: translateY(-50%); z-index: 35;
    display: flex; flex-direction: column; align-items: center; gap: 11px;
  }
  .rail-pill, .rail-solo {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 7px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(30,35,15,.05), 0 8px 22px rgba(30,35,15,.07);
  }
  .rail-b {
    width: 34px; height: 34px; border-radius: 50%; border: 0; background: none;
    color: var(--muted); display: grid; place-items: center; cursor: pointer; font: inherit;
  }
  .rail-b:hover { background: var(--surface-2); color: var(--ink); }
  .rail-b[aria-expanded="true"], .rail-b.on { background: var(--accent-soft); color: var(--accent); }
  .rail-b svg { width: 17px; height: 17px; }
  .rail .avatar { width: 34px; height: 34px; font-size: 12px; }
  /* The account reads as a person, not another control: brand green with the
     initials reversed out, rather than the pale accent-soft chip the other
     avatars in the app use. Fixed hex on both sides so it looks the same in
     either theme. */
  .rail-solo .avatar { background: var(--brand-green-800); color: #ffffff; border-color: transparent; }
  .rail-solo .avatar:hover { background: color-mix(in srgb, var(--brand-green-800) 82%, #fff); }
  /* The menu opens to the right of the rail, not below-left as it did when the
     avatar sat in the top-right corner of the page. */
  .rail .menu { left: calc(100% + 12px); right: auto; top: 0; }
  .rail-b { position: relative; }
  /* Count sits on the bell rather than beside it — the rail has no room for a
     label, and an unlabelled dot cannot say how many. */
  .rail-dot {
    position: absolute; top: 1px; right: 1px; min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 999px; background: var(--flag-fill); color: #2a1a08;
    font-size: 9.5px; font-weight: 700; line-height: 15px; text-align: center;
    border: 2px solid var(--surface); box-sizing: content-box;
  }
  .notif { width: 300px; padding: 0; }
  .notif-h { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 12.5px; }
  .notif-i {
    display: block; width: 100%; text-align: left; font: inherit; background: none; border: 0;
    padding: 9px 12px; cursor: pointer; color: var(--ink); border-top: 1px solid var(--line);
  }
  .notif-i:first-of-type { border-top: 0; }
  .notif-i:hover { background: var(--surface-2); }
  .notif-t { font-size: 12px; font-weight: 550; display: flex; align-items: center; gap: 6px; }
  .notif-s { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .notif-none { padding: 16px 12px; font-size: 12px; color: var(--muted); text-align: center; }
  .notif-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  /* On a wide screen there is room to spare in the left gutter, so the rail
     takes it — at 1180px of content the gutter only grows from here on, and a
     34px target floating in 200px of space reads as an afterthought. */
  @media (min-width: 1500px) {
    .rail { left: 22px; gap: 13px; }
    .rail-pill, .rail-solo { gap: 8px; padding: 9px; }
    .rail-b, .rail .avatar { width: 42px; height: 42px; }
    .rail-b svg { width: 20px; height: 20px; }
    .rail .avatar { font-size: 14px; }
  }
  @media (min-width: 1800px) {
    .rail { left: 30px; gap: 15px; }
    .rail-pill, .rail-solo { gap: 10px; padding: 10px; }
    .rail-b, .rail .avatar { width: 48px; height: 48px; }
    .rail-b svg { width: 22px; height: 22px; }
    .rail .avatar { font-size: 15.5px; }
  }

  /* Below this width the rail would sit on top of the content, so it lies flat
     along the bottom instead. */
  @media (max-width: 1320px) {
    .rail {
      left: 50%; top: auto; bottom: 14px; transform: translateX(-50%);
      flex-direction: row; gap: 8px;
    }
    .rail-pill, .rail-solo { flex-direction: row; }
    .rail .menu { left: auto; right: 0; top: auto; bottom: calc(100% + 12px); }
  }

  /* ---------- shell ---------- */
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  /* Pages sit centred in the window when they are shorter than it. `safe center`
     matters: with plain `center`, a page taller than the window would be centred
     and have its top clipped out of reach. */
  main {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: safe center;
  }
  @supports not (justify-content: safe center) {
    main { justify-content: flex-start; }
  }
  main > :first-child { margin-top: 0; }
  /* Must out-specify the rule above (0,2,1 beats 0,1,1) and follow it, or the
     sticky header's negative margin is silently zeroed and main's full 48px of
     top padding is left sitting above the greeting. */
  main > .pagehead:first-child { margin-top: -12px; }

  /* ---------- main ---------- */
  main { padding: 48px 32px 190px; max-width: 1180px; width: 100%; margin: 0 auto; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 28px; margin-bottom: 22px; }
  .head h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
  .head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
  /* Centred only when the header has nothing beside it. The heads that carry a
     button or a timer on the right stay left-aligned — centring the text under
     an off-centre action would read as a mistake rather than a choice. */
  .head > div:only-child { text-align: center; margin: 0 auto; }
  .head > div:only-child p { margin-left: auto; margin-right: auto; max-width: 104ch; }
  /* File details and their status pill, directly under the title — they say
     which file is on screen, which is page-level context rather than something
     belonging to the panel below. */
  /* The loaded file as an object you can act on, rather than a line of text:
     what it is, what was found in it, and a way to take it back off. */
  .filerow {
    display: flex; align-items: center; gap: 11px;
    max-width: 620px; margin: 10px auto 0; padding: 9px 11px 9px 13px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    text-align: left;
  }
  .filerow-ic { width: 20px; height: 20px; color: var(--accent); flex: none; }
  .filerow-ic svg { width: 100%; height: 100%; }
  .filerow-m { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .filerow-n { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .filerow-s { font-size: 10.5px; color: var(--muted); }
  .filerow-x {
    width: 26px; height: 26px; flex: none; border: 0; border-radius: 50%; cursor: pointer;
    background: none; color: var(--faint); display: grid; place-items: center;
  }
  .filerow-x svg { width: 14px; height: 14px; }
  .filerow-x:hover { background: var(--crit-soft); color: var(--crit); }

  .head-meta { display: flex; align-items: center; justify-content: center; gap: 9px; flex-wrap: wrap; }

  .panel { background: var(--group); border: 0; border-radius: 10px; overflow: hidden; }
  .panel table { background: var(--surface); }
  th { background: var(--group); }
  .panel + .panel { margin-top: 20px; }
  .panel-h {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: transparent;
  }
  .panel-h h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .panel-h p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .panel-b { padding: 14px 16px; }

  /* ---------- stats ---------- */
  /* The page summary as one line. Values carry the weight, labels stay quiet,
     and the separators are drawn rather than typed so they wrap cleanly. */
  .sumline {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px;
    margin: 0 2px 12px; font-size: 12px; color: var(--muted);
  }
  .sumline b { font-weight: 700; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sumline > span + span { padding-left: 18px; border-left: 1px solid var(--line); }
  @media (max-width: 700px) { .sumline > span + span { padding-left: 0; border-left: 0; } }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  /* Figure and label on one line, the note under them — stacked, each tile was
     three rows tall for what is really one fact and a footnote. */
  .stat {
    background: var(--group); border-radius: 9px; padding: 9px 12px;
    display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
  }
  .stat .v { font-size: 17px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .k { margin: 0; }
  .stat .d { font-size: 11px; color: var(--muted); margin: 1px 0 0; flex-basis: 100%; }

  /* ---------- table ---------- */

  .cell-in { width: 72px; text-align: right; font: inherit; font-size: 12px; font-variant-numeric: tabular-nums;
             padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); }
  .cell-in:focus { border-color: var(--accent); }
  .cell-in.bad { border-color: var(--crit); background: var(--crit-soft); }
  .cell-in.bad::placeholder { color: var(--crit); }
  td select { max-width: 190px; padding: 4px 9px; }


  /* One column. The checklist was a sidebar competing with the settings for
     the eye; stacked, the page reads as "here is what you are running, here is
     what it is running on, now go". */
  .runwrap { display: flex; flex-direction: column; gap: 12px; max-width: 760px; margin: 0 auto; }
  /* All nine plants are listed so the scope of the run is visible rather than
     asserted — the eight this planner does not own are faded rather than
     hidden, which is the honest picture of a per-plant cycle. */
  .unitrow { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
  .unittile {
    min-width: 108px; padding: 9px 13px; border-radius: 10px; text-align: center;

  .drop {

  const overallAt = (rows, i) => rows.length ? mean(rows.map(r => accuracyAt(r, i))) : 0;

  const RAW_HEADERS = [

  const MAP_FIELDS = [
    { k:'fg',   t:'FG item code',       req:true,  hints:['item code','item number','fg code','material code','sku'] },

    { k:'uom',  t:'UOM',                req:false, hints:['uom','unit of measure','inventory unit'] },

    { k:'m1',   t:'Month 2 quantity',   req:true,  hints:[] },

  //
  // Header matching is exact-first, then word-boundary, then substring. Naive
  // substring matching is a trap here: "Business".includes("bu") is true, so a
  // loose match on "bu" silently binds the unit column to Business and
  // quarantines every row.
  //
  // Headers alone are not enough either, so the two columns that matter most —
  // unit and item code — are additionally confirmed against their actual
  // values. That survives a renamed or unfamiliar header entirely.
  function matchHeader(headers, norm, hints) {
    for (const h of hints) {
      const i = norm.indexOf(h);
      if (i >= 0) return headers[i];
    }
    for (const h of hints) {
      const re = new RegExp('(^|[^a-z])' + h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z]|$)');
      const i = norm.findIndex(x => re.test(x));
      if (i >= 0) return headers[i];
    }
    for (const h of hints) {
      const i = norm.findIndex(x => x.includes(h));
      if (i >= 0) return headers[i];
    }
    return undefined;
  }

  // Score a column by how many of its values look like the thing we want.
  function bestByValue(headers, rows, test) {
    if (!rows || !rows.length) return undefined;
    const sample = rows.slice(0, 40);
    let best, bestScore = 0;
    headers.forEach(h => {
      const vals = sample.map(r => String(r[h] == null ? '' : r[h]).trim()).filter(Boolean);
      if (!vals.length) return;
      const score = vals.filter(test).length / vals.length;
      if (score > bestScore) { bestScore = score; best = h; }
    });
    return bestScore >= 0.6 ? best : undefined;
  }

  function guessMapping(headers, rows) {
    const norm = headers.map(h => h.toLowerCase().trim());
    const out = {};
    MAP_FIELDS.filter(f => f.hints.length).forEach(f => {
      const h = matchHeader(headers, norm, f.hints);
      if (h) out[f.k] = h;
    });

    // Month columns are matched positionally — their names carry the month and
    // change every cycle.
    const qty = headers.filter((_, i) => /fc qty|forecast/.test(norm[i] || ''));
    if (qty.length >= 3) { out.m0 = qty[0]; out.m1 = qty[1]; out.m2 = qty[2]; }

    // Confirm against real values, which beats any header guess.
    const codes = new Set(UNITS.map(u => u.code));
    const byUnit = bestByValue(headers, rows, v => {
      const u = v.toUpperCase();
      return codes.has(u) || Object.prototype.hasOwnProperty.call(UNIT_FIXES, u);
    });

    const byFg = bestByValue(headers, rows, v => KNOWN_FG.has(v) || /^F[SR][A-Z0-9]{6,}$/.test(v));
    if (byFg) out.fg = byFg;

    return out;
  }

  const MAP_KEY = 'agf-mrp.mapping';
  const loadMapping = (headers, rows) => {
    try {
      const st = JSON.parse(localStorage.getItem(MAP_KEY) || 'null');
      if (st && Object.values(st).every(v => !v || headers.includes(v))) return { map: st, remembered: true };
    } catch (e) { /* fall through to a fresh guess */ }
    return { map: guessMapping(headers, rows), remembered: false };
  };
  const saveMapping = m => { try { localStorage.setItem(MAP_KEY, JSON.stringify(m)); } catch (e) { /* private mode */ } };

  // Row-level validation. Bad rows are quarantined; the rest of the file loads.
  function validateRows(rows, map) {
    const numOf = v => {
      const c = String(v == null ? '' : v).replace(/[, ]/g, '').trim();
      if (c === '') return null;
      const n = Number(c);
      return isFinite(n) ? n : null;
    };
    return rows.map((raw, i) => {
      const at = { row: i + 13, raw };   // header sits on row 12
      const fg = String(raw[map.fg] || '').trim();
      if (!fg) return { ...at, out:'quarantined', why:'Item code is blank.' };
      if (!KNOWN_FG.has(fg)) return { ...at, out:'quarantined', fg, why:`Item code ${fg} does not exist on the item master.` };

      let unit = String(raw[map.unit] || '').trim().toUpperCase();
      let fixed = false;
      if (!UNITS.some(u => u.code === unit)) {
        if (UNIT_FIXES[unit]) { unit = UNIT_FIXES[unit]; fixed = true; }
        else return { ...at, out:'quarantined', fg, why:`Unit "${unit}" is not a recognised manufacturing unit.` };
      }

      const m0 = numOf(raw[map.m0]), m1 = numOf(raw[map.m1]), m2 = numOf(raw[map.m2]);
      if ([m0, m1, m2].some(v => v !== null && v < 0)) return { ...at, out:'quarantined', fg, why:'Forecast quantity is negative.' };

      const data = { fg, unit, uom: String(raw[map.uom] || 'MT').trim() || 'MT',
        m0: m0 || 0, m1: m1 || 0, m2: m2 || 0, desc: map.desc ? raw[map.desc] : '' };

      if (fixed) return { ...at, out:'corrected', fg, data, why:`Unit code corrected to ${unit}.` };
      if (m0 === null || m1 === null || m2 === null) return { ...at, out:'warning', fg, data, why:'A month quantity is blank and was read as zero.' };
      return { ...at, out:'loaded', fg, data };
    });
  }

  const REASON_CODES = [
    'Warehouse space constraint',
    'Supplier MOQ change',
    'Known forecast error',
    'Production schedule change',
    'Stock in transit not yet received',
    'Batch not closed — consumption understated',
    'Material being phased out'
  ];


  // Custom calculation rules Ram has built. The two predefined logics are
  // immutable and live in the engine; these sit alongside them and are assigned
  // on the item master, exactly as BRD 6.3 / FR-14 require ("the logic type
  // should be stored against each material as master data, so the same rule is
  // applied every month by the system rather than remembered by the planner").
  //
  // Precedence, applied in this order:
  //   1. a rule assigned to the specific material
  //   2. a rule assigned to its category, then to its plant
  //   3. the predefined logic for its tag
  //   4. tags 2-4 — excluded, never calculated
  const PREDEF = {
    L1: { id:'L1', name:'Logic 1 — from the forecast', built:true,
          desc:'Forecast for the product it makes, through the recipe, less stock and open orders.' },
    L2: { id:'L2', name:'Logic 2 — from past usage', built:true,
          desc:'Enough to cover the wait for delivery plus a safety margin, less stock and open orders.' }
  };

  // Which rule actually applies to a material.
  function ruleFor(m) {
    if (!inScope(m)) return null;
    const byMat = state.customRules.find(r => r.scope === 'material' && r.target === m.code);
    if (byMat) return byMat;
    const byCat = state.customRules.find(r => r.scope === 'category' && r.target === m.unit + '|' + m.cat);
    if (byCat) return byCat;
    const byUnit = state.customRules.find(r => r.scope === 'unit' && r.target === m.unit);
    if (byUnit) return byUnit;
    return null;
  }

  // What the item master shows in the Logic column.
  const logicIdFor = m => {
    const r = ruleFor(m);
    if (r) return r.id;
    return m.tag === 0 ? 'L1' : 'L2';
  };
  const logicNameFor = m => {
    const r = ruleFor(m);
    if (r) return r.name;
    return m.tag === 0 ? 'Logic 1' : 'Logic 2';
  };

  // ---- maths ----
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const stdev = a => { if (!a.length) return 0; const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
  const lastN = (a, n) => a.slice(Math.max(0, a.length - n));
  // Days of cover below which a material is treated as at risk of stocking out.
  // FR-29 asks for a supplier filter and no material carried a supplier, so one
  // is derived from what the item master does hold — category and whether it is
  // imported or bought locally. ILLUSTRATIVE: these names are placeholders for
  // the vendor account that would come from D365.
  const SUPPLIERS = {
    'Raw Material|import': 'Gulf Grain Traders',
    'Raw Material|local':  'Al Ghurair Resources',
    'Packaging|import':    'TechnoPack FZE',
    'Packaging|local':     'Emirates Packaging Co',
    'Chemical|import':     'Danube Materials',
    'Chemical|local':      'Jebel Chemicals LLC'
  };
  const supplierOf = m => SUPPLIERS[`${m.cat}|${m.src}`] || 'Unassigned';

  const coverFloor = m => m.lt * CONFIG.coverRatio;

  const inScope = m => m.life !== 'discontinued' && (m.tag === 0 || m.tag === 1);
  // Bound to the tag's MEANING, never its number — the BRD and the whiteboard

  const resolveLogic = m => !inScope(m) ? 'EXCLUDED' : (m.tag === 0 ? 'BOM' : 'TREND');

  // item master and the dashboard gap count so the two numbers can never disagree.
  const COVER_BANDS = { thin: 10, overCovered: 90 };
  // tone drives the pill colour; cls drives the whole-card background — kept
  // separate from tone so the card class can never drift from the stylesheet
  // the way it did on the first pass (tone 'flag' produced class "card-flag",
  // which the stylesheet never defined, so the fill silently never applied).
  function coverStatus(days) {
    if (days < COVER_BANDS.thin) return { label:'Running thin', tone:'crit', cls:'card-crit' };
    if (days > COVER_BANDS.overCovered) return { label:'Over-covered', tone:'good', cls:'card-good' };
    return null;
  }

  const PREDEF_FORMULAS = {
    L1: '(FORECAST_M + FORECAST_M1) * BOM_FACTOR - SOH - OPEN_PO',
    L2: '(LEAD_TIME * DAILY_REQ) + (SAFETY_DAYS * DAILY_REQ) - SOH - OPEN_PO'
  };

  const gapsOf = m => {
    const g = [];
    if (m.bundle == null) g.push('bundle size');

    if (!m.price) g.push('price');
    if (m.tag === 0 && m.bom == null) g.push('recipe factor');

  // The last completed inventory close per unit. BRD: "each unit closes its

  // Prior forecast uploads. Sales send one file per cycle covering every plant,

  // this session — otherwise it shows as not yet loaded rather than inventing

  const vLabel = v => 'v' + (v && v.n != null ? v.n : v);

  // Seeded history plus whatever has been accepted this session, oldest first.
  const allVersions = () => state.versions;
  const nextVersionNo = () => state.versions.reduce((a, v) => Math.max(a, v.n), 0) + 1;
  const currentVersion = () => state.versions.find(v => v.n === state.forecastVersion) || null;

  // superseded by a newer one. This is the lock, enforced rather than labelled.
  const versionLocked = n => !!(state.versions.find(v => v.n === n) || {}).usedBy;

  const LAST_CLOSE = {
    NFM:'2026-07-31', JFM:'2026-07-31', OAT:'2026-08-01', EOP:'2026-07-31',
    FPM:'2026-07-30', AGSM:'2026-07-31', AGFM:'2026-07-31', AGPK:'2026-08-01',
    AGLE:'2026-07-31', AGPP:'2026-07-31', AGPD:'2026-07-31', AGCF:'2026-07-31',
    AGHP:'2026-08-01'
  };
  // Stock and open orders land at 06:00 each day over Synapse Link. Derived

  function syncAt() {
    const d = new Date();
    if (d.getHours() < 6) d.setDate(d.getDate() - 1);
    d.setHours(6, 0, 0, 0);

  }
  const syncHoursAgo = () => Math.max(0, Math.round((Date.now() - syncAt().getTime()) / 3600000));

  const daysSince = iso => Math.round((Date.now() - new Date(iso + 'T00:00:00').getTime()) / 86400000);

  const logicLabel = k => k === 'BOM' ? 'Logic 1 — from the forecast' : k === 'TREND' ? 'Logic 2 — from past usage' : k === 'CUSTOM' ? 'Your own rule' : 'Excluded';

  function calculate(m, fc) {
    const t = [];
    const push = (label, expr, val, note) => t.push({ label, expr, val, note });

    const l3 = lastN(m.cons, 3), l6 = lastN(m.cons, 6);
    const l3m = mean(l3), sd6 = stdev(l6);

    push('L3M — average of last 3 months', 'mean(' + l3.map(n => fmt(n)).join(', ') + ')', l3m);
    push('STDEV6 — standard deviation of last 6 months', 'stdev(last 6 months)', sd6);

    const buffer = CONFIG.safetyBufferFactor * sd6;
    push('Variability buffer inside AMC', CONFIG.safetyBufferFactor + ' x STDEV6', buffer,
      'This buffer is separate from, and additional to, the ' + m.safety + ' safety days applied in MSL below. Review whether both are intended.');

    const amc = l3m + buffer;
    push('AMC — average monthly consumption', 'L3M + buffer', amc);

    const daily = amc / 30;
    push('Daily requirement', 'AMC / 30', daily);

    const doi = amc > 0 ? (m.soh / amc) * 30 : 0;
    const toi = amc > 0 ? ((m.soh + m.po) / amc) * 30 : 0;
    push('DOI — days on hand (physical stock only)', '(SOH / AMC) x 30', doi);
    push('TOI — total days on inventory (stock + open PO)', '((SOH + OPEN_PO) / AMC) x 30', toi,
      'Corrected form. The BRD prints the parentheses in the wrong place; the live workbook uses this form.');

    const rule = ruleFor(m);
    const logic = rule ? 'CUSTOM' : resolveLogic(m);
    let req = 0, msl = 0;

    if (rule) {
      const out = runFormula(rule.formula, varsFor(m, fc));
      req = out.ok ? out.value : 0;
      push(`Your rule — ${rule.name}`, rule.formula, req,
        out.ok ? 'This material uses a rule you built, instead of the built-in one.'
               : 'The rule could not be worked out (' + out.error + '), so nothing is requested.');
    } else if (logic === 'TREND') {
      const leadPart = m.lt * daily, safePart = m.safety * daily;
      msl = leadPart + safePart;
      push('Lead time cover', 'LEAD_TIME x DAILY_REQ', leadPart, 'Lead time already includes the 7-day processing time held on the item master.');
      push('Safety stock cover', 'SAFETY_DAYS x DAILY_REQ', safePart);
      push('MSL — minimum stock level', 'lead time cover + safety stock cover', msl);
      req = msl - m.soh - m.po;
      push('Requirement quantity (Logic 2)', 'MSL − SOH − OPEN_PO', req);
    } else if (logic === 'BOM') {
      const f0 = fc ? fc.m0 : 0, f1 = fc ? fc.m1 : 0, factor = m.bom || 0;
      const gross = (f0 + f1) * factor;
      push('Forecast demand across horizon', 'FORECAST_M + FORECAST_M1', f0 + f1);
      push('Exploded through BOM', '(FORECAST_M + FORECAST_M1) x BOM_FACTOR (' + factor + ')', gross);
      req = gross - m.soh - m.po;
      push('Requirement quantity (Logic 1)', 'gross − SOH − OPEN_PO', req);
    }

    const exceptions = [];

    if (logic === 'EXCLUDED') {
      const why = m.life === 'discontinued'
        ? 'Material is discontinued — no future requirement.'
        : m.tag === 2 ? 'Tag 2 — commodities, grains, livestock and raw eggs run under a different operating model.'
        : m.tag === 3 ? 'Tag 3 — customer supplied material.'
        : 'Tag 4 — discontinued or obsolete, no future requirement.';
      return { m, logic, req:0, prQty:0, prValue:0, amc, daily, msl:0, doi, toi, releases:[],
        trail:[{ label:'Excluded from calculation', expr:'tag ' + m.tag, val:0, note:why }],
        exceptions:['excluded'], reason:why, excluded:true };
    }

    let net = Math.max(0, req), prQty = net;
    if (net > 0) {
      if (net < m.moq) { prQty = m.moq; push('Supplier MOQ applied', 'max(requirement, MOQ)', prQty); }
      if (m.bundle == null) {
        exceptions.push('gap');
        push('Bundle rounding', 'roundup(qty / BUNDLE) x BUNDLE', prQty, 'Bundle size is missing on the item master — the quantity could not be rounded.');
      } else {
        prQty = Math.ceil(prQty / m.bundle) * m.bundle;
        push('Rounded to bundle', 'roundup(qty / ' + fmt(m.bundle) + ') x ' + fmt(m.bundle), prQty);
      }
    }

    const prValue = prQty * m.price;
    push('PR value', 'PR_QTY x unit cost', prValue);

    if (logic === 'TREND' && amc <= 0) exceptions.push('nodemand');
    if (logic === 'BOM' && !fc) exceptions.push('nodemand');
    if (toi < coverFloor(m)) exceptions.push('cover');

    const releases = split(m, prQty);
    if (m.band === 'weekly' && m.pallet && m.whPallets != null && prQty > m.pallet * m.whPallets) exceptions.push('space');

    let reason = null;
    if (exceptions.includes('gap')) reason = 'Bundle size is missing, so the quantity could not be rounded to a full pallet.';
    else if (exceptions.includes('nodemand')) reason = 'No forecast and no consumption history — there is no demand signal to plan from.';
    else if (exceptions.includes('space')) reason = 'Suggested quantity exceeds the warehouse pallet space available for this material.';
    else if (exceptions.includes('cover')) reason = 'Cover is ' + Math.round(toi) + ' days including open POs against a ' + m.lt + '-day lead time — it runs out long before a replenishment can land.';

    return { m, logic, req, prQty, prValue, amc, daily, msl, doi, toi, releases, trail:t, exceptions, reason, excluded:false };
  }

  // Weekly band is called off against warehouse pallet capacity. Weeks are NOT
  // necessarily consecutive — the observed pattern is WK1 / WK2 / WK4.
  function split(m, prQty) {
    if (prQty <= 0) return [];
    if (m.band === 'monthly') return [{ week:1, qty:prQty }];
    const cap = (m.pallet && m.whPallets) ? m.pallet * m.whPallets : prQty;
    if (cap <= 0) return [{ week:1, qty:prQty }];
    const out = []; let rem = prQty;
    for (const wk of [1, 2, 4]) {
      if (rem <= 0) break;
      const q = Math.min(cap, rem);
      out.push({ week:wk, qty:q });
      rem -= q;
    }
    if (rem > 0 && out.length) out[out.length - 1].qty += rem;
    return out;
  }


  // ===================================================================
  // FORMULA ENGINE
  // Tokeniser -> shunting-yard -> RPN evaluator. Deliberately NOT eval or
  // new Function: this evaluates text an admin typed, and it has to fail
  // safely and explain itself rather than execute arbitrary code.
  // ===================================================================

  const TOKEN_GROUPS = {
    'Demand':      ['FORECAST_M', 'FORECAST_M1', 'BOM_FACTOR'],
    'Consumption': ['AMC', 'L3M', 'L6M', 'LM', 'STDEV6', 'DAILY_REQ'],
    'Parameters':  ['LEAD_TIME', 'SAFETY_DAYS', 'MOQ', 'BUNDLE', 'PALLET'],
    'Position':    ['SOH', 'OPEN_PO', 'WH_SPACE']
  };
  const ALL_TOKENS = Object.values(TOKEN_GROUPS).flat();
  const FUNCS = {
    MIN: a => Math.min(...a), MAX: a => Math.max(...a),
    ROUNDUP: a => Math.ceil(a[0]), ROUND: a => Math.round(a[0]), ABS: a => Math.abs(a[0])
  };
  const PREC = { '+':1, '-':1, '*':2, '/':2 };

  function tokenize(src) {
    const out = [];
    let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        let j = i;
        while (j < src.length && /[0-9.]/.test(src[j])) j++;
        const raw = src.slice(i, j);
        if ((raw.match(/\./g) || []).length > 1) throw new Error(`"${raw}" is not a valid number.`);
        out.push({ t:'num', v: Number(raw) });
        i = j; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        let j = i;
        while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
        const word = src.slice(i, j).toUpperCase();
        if (FUNCS[word]) out.push({ t:'func', v: word });
        else if (ALL_TOKENS.includes(word)) out.push({ t:'var', v: word });
        else throw new Error(`"${word}" is not a value you can use here.`);
        i = j; continue;
      }
      if ('+-*/'.includes(c)) { out.push({ t:'op', v:c }); i++; continue; }
      if (c === '(') { out.push({ t:'lp' }); i++; continue; }
      if (c === ')') { out.push({ t:'rp' }); i++; continue; }
      if (c === ',') { out.push({ t:'sep' }); i++; continue; }
      if (c === '×') { out.push({ t:'op', v:'*' }); i++; continue; }
      if (c === '÷') { out.push({ t:'op', v:'/' }); i++; continue; }
      throw new Error(`"${c}" is not something this can read.`);
    }
    return out;
  }

  function toRpn(tokens) {
    const out = [], ops = [];
    let depth = 0;
    tokens.forEach(tk => {
      if (tk.t === 'num' || tk.t === 'var') out.push(tk);
      else if (tk.t === 'func') ops.push(tk);
      else if (tk.t === 'sep') {
        while (ops.length && ops[ops.length - 1].t !== 'lp') out.push(ops.pop());
        if (!ops.length) throw new Error('A comma is outside its brackets.');
      } else if (tk.t === 'op') {
        while (ops.length && ops[ops.length - 1].t === 'op' &&
               PREC[ops[ops.length - 1].v] >= PREC[tk.v]) out.push(ops.pop());
        ops.push(tk);
      } else if (tk.t === 'lp') { ops.push(tk); depth++; }
      else if (tk.t === 'rp') {
        depth--;
        if (depth < 0) throw new Error('There is a closing bracket with no opening one.');
        while (ops.length && ops[ops.length - 1].t !== 'lp') out.push(ops.pop());
        ops.pop();
        if (ops.length && ops[ops.length - 1].t === 'func') out.push(ops.pop());
      }
    });
    if (depth > 0) throw new Error(`${depth} bracket${depth > 1 ? 's are' : ' is'} left open.`);
    while (ops.length) {
      const o = ops.pop();
      if (o.t === 'lp') throw new Error('There is an opening bracket with no closing one.');
      out.push(o);
    }
    return out;
  }

  function evalRpn(rpn, vars) {
    const st = [];
    rpn.forEach(tk => {
      if (tk.t === 'num') st.push(tk.v);
      else if (tk.t === 'var') {
        const v = vars[tk.v];
        if (v == null || !isFinite(v)) throw new Error(`${tk.v} has no value on this material.`);
        st.push(v);
      } else if (tk.t === 'op') {
        const b = st.pop(), a = st.pop();
        if (a === undefined || b === undefined) throw new Error('An operator is missing a number.');
        if (tk.v === '/' && b === 0) throw new Error('This divides by zero.');
        st.push(tk.v === '+' ? a + b : tk.v === '-' ? a - b : tk.v === '*' ? a * b : a / b);
      } else if (tk.t === 'func') {
        const args = st.splice(Math.max(0, st.length - (tk.v === 'MIN' || tk.v === 'MAX' ? 2 : 1)));
        if (!args.length) throw new Error(`${tk.v} is missing its value.`);
        st.push(FUNCS[tk.v](args));
      }
    });
    if (st.length !== 1) throw new Error('This is not a complete calculation.');
    return st[0];
  }

  function runFormula(src, vars) {
    if (!src || !src.trim()) return { ok:false, error:'Nothing written yet.' };
    try {
      return { ok:true, value: evalRpn(toRpn(tokenize(src)), vars) };
    } catch (e) {
      return { ok:false, error: e.message };
    }
  }

  // Every value a formula can see, for one material.
  function varsFor(m, fc) {
    const l3 = lastN(m.cons, 3), l6 = lastN(m.cons, 6);
    const amc = mean(l3) + CONFIG.safetyBufferFactor * stdev(l6);
    return {
      FORECAST_M: fc ? fc.m0 : 0, FORECAST_M1: fc ? fc.m1 : 0, BOM_FACTOR: m.bom || 0,
      AMC: amc, L3M: mean(l3), L6M: mean(l6), LM: m.cons[m.cons.length - 1] || 0,
      STDEV6: stdev(l6), DAILY_REQ: amc / 30,
      LEAD_TIME: m.lt, SAFETY_DAYS: m.safety, MOQ: m.moq,
      BUNDLE: m.bundle || 0, PALLET: m.pallet || 0,
      SOH: m.soh, OPEN_PO: m.po, WH_SPACE: (m.pallet || 0) * (m.whPallets || 0)
    };
  }

  // ===================================================================
  // FORMAT

  const fmt = (n, dp = 0) => (n == null || !isFinite(n)) ? '—' : n.toLocaleString('en-AE', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  // UAE's new Dirham symbol (adopted 2025) isn't in most system fonts yet and

  const DHS_SVG = '<svg viewBox="0 0 1000 870" fill="currentColor" aria-hidden="true"><path d="m88.3 1c0.4 0.6 2.6 3.3 4.7 5.9 15.3 18.2 26.8 47.8 33 85.1 4.1 24.5 4.3 32.2 4.3 125.6v87h-41.8c-38.2 0-42.6-0.2-50.1-1.7-11.8-2.5-24-9.2-32.2-17.8-6.5-6.9-6.3-7.3-5.9 13.6 0.5 17.3 0.7 19.2 3.2 28.6 4 14.9 9.5 26 17.8 35.9 11.3 13.6 22.8 21.2 39.2 26.3 3.5 1 10.9 1.4 37.1 1.6l32.7 0.5v43.3 43.4l-46.1-0.3-46.3-0.3-8-3.2c-9.5-3.8-13.8-6.6-23.1-14.9l-6.8-6.1 0.4 19.1c0.5 17.7 0.6 19.7 3.1 28.7 8.7 31.8 29.7 54.5 57.4 61.9 6.9 1.9 9.6 2 38.5 2.4l30.9 0.4v89.6c0 54.1-0.3 94-0.8 100.8-0.5 6.2-2.1 17.8-3.5 25.9-6.5 37.3-18.2 65.4-35 83.6l-3.4 3.7h169.1c101.1 0 176.7-0.4 187.8-0.9 19.5-1 63-5.3 72.8-7.4 3.1-0.6 8.9-1.5 12.7-2.1 8.1-1.2 21.5-4 40.8-8.9 27.2-6.8 52-15.3 76.3-26.1 7.6-3.4 29.4-14.5 35.2-18 3.1-1.8 6.8-4 8.2-4.7 3.9-2.1 10.4-6.3 19.9-13.1 4.7-3.4 9.4-6.7 10.4-7.4 4.2-2.8 18.7-14.9 25.3-21 25.1-23.1 46.1-48.8 62.4-76.3 2.3-4 5.3-9 6.6-11.1 3.3-5.6 16.9-33.6 18.2-37.8 0.6-1.9 1.4-3.9 1.8-4.3 2.6-3.4 17.6-50.6 19.4-60.9 0.6-3.3 0.9-3.8 3.4-4.3 1.6-0.3 24.9-0.3 51.8-0.1 53.8 0.4 53.8 0.4 65.7 5.9 6.7 3.1 8.7 4.5 16.1 11.2 9.7 8.7 8.8 10.1 8.2-11.7-0.4-12.8-0.9-20.7-1.8-23.9-3.4-12.3-4.2-14.9-7.2-21.1-9.8-21.4-26.2-36.7-47.2-44l-8.2-3-33.4-0.4-33.3-0.5 0.4-11.7c0.4-15.4 0.4-45.9-0.1-61.6l-0.4-12.6 44.6-0.2c38.2-0.2 45.3 0 49.5 1.1 12.6 3.5 21.1 8.3 31.5 17.8l5.8 5.4v-14.8c0-17.6-0.9-25.4-4.5-37-7.1-23.5-21.1-41-41.1-51.8-13-7-13.8-7.2-58.5-7.5-26.2-0.2-39.9-0.6-40.6-1.2-0.6-0.6-1.1-1.6-1.1-2.4 0-0.8-1.5-7.1-3.5-13.9-23.4-82.7-67.1-148.4-131-197.1-8.7-6.7-30-20.8-38.6-25.6-3.3-1.9-6.9-3.9-7.8-4.5-4.2-2.3-28.3-14.1-34.3-16.6-3.6-1.6-8.3-3.6-10.4-4.4-35.3-15.3-94.5-29.8-139.7-34.3-7.4-0.7-17.2-1.8-21.7-2.2-20.4-2.3-48.7-2.6-209.4-2.6-135.8 0-169.9 0.3-169.4 1zm330.7 43.3c33.8 2 54.6 4.6 78.9 10.5 74.2 17.6 126.4 54.8 164.3 117 3.5 5.8 18.3 36 20.5 42.1 10.5 28.3 15.6 45.1 20.1 67.3 1.1 5.4 2.6 12.6 3.3 16 0.7 3.3 1 6.4 0.7 6.7-0.5 0.4-100.9 0.6-223.3 0.5l-222.5-0.2-0.3-128.5c-0.1-70.6 0-129.3 0.3-130.4l0.4-1.9h71.1c39 0 78 0.4 86.5 0.9zm297.5 350.3c0.7 4.3 0.7 77.3 0 80.9l-0.6 2.7-227.5-0.2-227.4-0.3-0.2-42.4c-0.2-23.3 0-42.7 0.2-43.1 0.3-0.5 97.2-0.8 227.7-0.8h227.2zm-10.2 171.7c0.5 1.5-1.9 13.8-6.8 33.8-5.6 22.5-13.2 45.2-20.9 62-3.8 8.6-13.3 27.2-15.6 30.7-1.1 1.6-4.3 6.7-7.1 11.2-18 28.2-43.7 53.9-73 72.9-10.7 6.8-32.7 18.4-38.6 20.2-1.2 0.3-2.5 0.9-3 1.3-0.7 0.6-9.8 4-20.4 7.8-19.5 6.9-56.6 14.4-86.4 17.5-19.3 1.9-22.4 2-96.7 2h-76.9v-129.7-129.8l220.9-0.4c121.5-0.2 221.6-0.5 222.4-0.7 0.9-0.1 1.8 0.5 2.1 1.2z"/></svg>';
  const dhs = () => `<span class="dhs">${DHS_SVG}</span>`;
  const aed = n => dhs() + fmt(Math.round(n));
  const aedM = n => dhs() + (n / 1e6).toFixed(2) + 'M';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  const WEEK_DATES = ['1 Sep', '8 Sep', '15 Sep', '22 Sep'];


  // Radial half gauge. The arc spans GAUGE_MIN..100 rather than 0..100 —
  // planning accuracy lives in a narrow band near the top, so a full-range dial
  // would compress every real difference into a few degrees. Endpoints are
  // labelled so the truncated scale is explicit, not misleading.
  const GAUGE_MIN = 70;
  const gaugeFrac = v => Math.max(0, Math.min(1, (v - GAUGE_MIN) / (100 - GAUGE_MIN)));
  const accTone = a => a >= 95 ? 'var(--good)' : a >= 90 ? 'var(--flag-fill)' : 'var(--crit)';



  const dhBadge = tone => `<span class="dh-b dh-${tone}" aria-hidden="true">${tone === 'good' ? '✓' : '!'}</span>`;

  // Compact radial for the KPI card. Same GAUGE_MIN..100 scale as the full dial.
  //
  // One solid colour rather than the red-amber-green sweep the full dial uses:
  // at this size the gradient painted most of the arc in colours that had
  // nothing to do with the reading — a 95% arc still ran through red and amber
  // on its way round. The single tone says the same thing and says it once.
  // The figure sits down inside the arc, on its baseline, and carries that
  // same tone, so the card is read in one glance rather than two.
  function miniGauge(value) {
    const R = 42, CX = 58, CY = 50, L = Math.PI * R, W = 8;
    const frac = gaugeFrac(value), tone = accTone(value);
    return `<svg class="mgauge" viewBox="0 0 116 60" role="img"
      aria-label="Forecast accuracy ${value.toFixed(1)} percent, scale ${GAUGE_MIN} to 100">
      <path d="M ${CX - R} ${CY} A ${R} ${R} 0 0 1 ${CX + R} ${CY}" fill="none"
        stroke="var(--surface-2)" stroke-width="${W}" stroke-linecap="round"/>
      <path d="M ${CX - R} ${CY} A ${R} ${R} 0 0 1 ${CX + R} ${CY}" fill="none"
        stroke="${tone}" stroke-width="${W}" stroke-linecap="round"
        stroke-dasharray="${(frac * L).toFixed(2)} ${L.toFixed(2)}"
        stroke-dashoffset="${(frac * L).toFixed(2)}" class="arc-draw"/>
      <text x="${CX}" y="${CY - 1}" text-anchor="middle" class="mgauge-v" fill="${tone}">${value.toFixed(1)}%</text>
    </svg>`;
  }

  // A plain 0..100 radial for any percentage, in whatever colour the caller's
  // own status logic has already decided. Deliberately not miniGauge: that one
  // runs on the GAUGE_MIN..100 accuracy scale and picks its colour from the
  // accuracy bands, both of which are wrong for a rework rate where 4% is bad
  // and a 100% adoption target where the whole range matters.
  function radialPct(pct, label, colour) {
    const R = 42, CX = 58, CY = 50, L = Math.PI * R, W = 8;
    const frac = Math.max(0, Math.min(1, pct / 100));
    return `<svg class="rgauge" viewBox="0 0 116 60" role="img" aria-label="${esc(label)}">
      <path d="M ${CX - R} ${CY} A ${R} ${R} 0 0 1 ${CX + R} ${CY}" fill="none"
        stroke="color-mix(in srgb, ${colour} 22%, var(--surface))" stroke-width="${W}" stroke-linecap="round"/>
      <path d="M ${CX - R} ${CY} A ${R} ${R} 0 0 1 ${CX + R} ${CY}" fill="none"
        stroke="${colour}" stroke-width="${W}" stroke-linecap="round"
        stroke-dasharray="${(frac * L).toFixed(2)} ${L.toFixed(2)}"
        stroke-dashoffset="${(frac * L).toFixed(2)}" class="arc-draw"/>
      <text x="${CX}" y="${CY - 1}" text-anchor="middle" class="mgauge-v" fill="${colour}">${esc(label)}</text>
    </svg>`;
  }

  // "97.1%" -> 97.1, "−62%" -> 62, anything else -> null. The arc takes the
  // magnitude; the label keeps the sign the caller wrote.
  const pctOf = v => {
    const m = /^[−-]?\s*([\d.]+)\s*%$/.exec(String(v));
    return m ? parseFloat(m[1]) : null;
  };

  function halfGauge(value, rows) {
    const R = 82, CX = 100, CY = 96, L = Math.PI * R;
    const frac = gaugeFrac(value);
    const tone = accTone(value);
    // Each unit marked as a tick, so the dial shows the spread behind the average.
    const ticks = rows.map(r => {
      const a = accuracyAt(r, state.accCycle) * 100;
      const ang = Math.PI * (1 - gaugeFrac(a));
      const x1 = CX + Math.cos(ang) * (R - 10), y1 = CY - Math.sin(ang) * (R - 10);
      const x2 = CX + Math.cos(ang) * (R + 10), y2 = CY - Math.sin(ang) * (R + 10);
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
        stroke="var(--surface)" stroke-width="1.6" opacity=".85"><title>${r.unit} ${a.toFixed(1)}%</title></line>`;
    }).join('');

    return `<svg class="gauge" viewBox="0 0 200 128" role="img"
      aria-label="Overall planning accuracy ${value.toFixed(1)} percent, on a scale from ${GAUGE_MIN} to 100 percent">

      ${ticks}
      <path d="M ${CX - R} ${CY} A ${R} ${R} 0 0 1 ${CX + R} ${CY}" fill="none"
        stroke="url(#halfGaugeGrad)" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="${(frac * L).toFixed(2)} ${L.toFixed(2)}"
        stroke-dashoffset="${(frac * L).toFixed(2)}" class="arc-draw"/>

      <text x="${CX}" y="${CY + 2}" text-anchor="middle" class="gauge-k" fill="var(--muted)">overall accuracy</text>

  // ===================================================================

  // Named, because inserting a step and leaving a hardcoded number behind
  // silently breaks whichever screen used to hold that slot.
  const STEP_FORECAST = 1, STEP_ITEMS = 2, STEP_RUN = 3, STEP_REVIEW = 4, STEP_ORDERS = 5;

  // Pages that sit outside the planning cycle. Numbered well clear of the steps
  // so inserting a sixth step can never collide with one.
  const PAGE_METRICS = 20;
  const PAGE_VERSIONS = 21;
  const PAGE_CYCLES = 22;

  const isPage = n => n >= PAGE_METRICS;

  const STEPS = [
    { n:1, t:'Forecast',    s:'What Sales expect to sell' },

  ];

  // A planner is assigned one business unit. Every other unit is visible but
  // read-only — never hidden, so they can see a plant exists and that it is not
  // theirs. (BRD FR-46 "restrict access by unit and by role"; whiteboard item 6,
  // "READ ONLY - PLNR".) Assignment derives from D365 legal-entity access.
  const USER = { name:'Ramaprabhu Paramaguru', short:'Ram', initials:'RP', unit:'NFM' };

  // Two D365 security roles, exactly as the BRD defines them. Both are granted in
  // Dynamics and read here over SSO — this app never stores its own copy, or the
  // access review stops being answerable from D365 alone.
  //
  // A user may hold both; privileges are the union. Ram does exactly that: he
  // plans his own plant AND administers the calculation rules.
  //   planner : run, review and order — assigned plant only
  //   admin   : build, edit and assign calculation logic. That is its ONLY
  //             capability — it grants no extra plants and no extra data.
  const ROLES = {
    planner: 'MRP Item Planner',
