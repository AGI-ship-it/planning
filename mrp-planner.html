  const hasRole = r => state.roles.includes(r);
  const isAdmin = () => hasRole('admin');

  // Three states, not two: the stylesheet's dark rules are written as a
  // prefers-color-scheme block guarded by :not([data-theme="light"]) plus a
  // [data-theme="dark"] block, so "follow the OS" is a real setting and not
  // just the absence of a choice. A two-way toggle would strand anyone whose
  // machine switches at sunset.
  const THEMES = [
    { k:'light',  t:'Light' },
    { k:'dark',   t:'Dark' },
    { k:'system', t:'System' }
  ];
  const THEME_KEY = 'mrp.theme';

  function applyTheme(k) {
    state.theme = k;
    if (k === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = k;
    try { localStorage.setItem(THEME_KEY, k); } catch (e) { /* private mode */ }
  }

  function loadTheme() {
    let k = null;
    try { k = localStorage.getItem(THEME_KEY); } catch (e) { /* private mode */ }
    applyTheme(THEMES.some(t => t.k === k) ? k : 'system');
  }

  // The whiteboard's "FORMULA SETUP - PLNG. MGR" names who does it today, not a
  // limit on who may. Confirmed: admin is not restricted to a single holder, so
  // the role carries no single point of failure and nothing here caps it.

  const myUnit = () => state.myUnit;
  const canEdit = line => line.m.unit === state.myUnit;
  const myName = () => UNITS.find(u => u.code === state.myUnit)?.name || state.myUnit;

  // Greeting follows the machine clock. Afternoon is included alongside
  // morning/evening/night — without it, 2pm would have to read as one of the
  // other three, and all of them are wrong at 2pm.
  const GREETINGS = [
    { from: 5,  to: 12, text:'Good morning',   emoji:'\u2600\uFE0F'  },  // 05:00-11:59  sun
    { from: 12, to: 17, text:'Good afternoon', emoji:'\uD83C\uDF24\uFE0F' },  // 12:00-16:59  sun behind cloud
    { from: 17, to: 21, text:'Good evening',   emoji:'\uD83C\uDF06'  },  // 17:00-20:59  dusk
    { from: 21, to: 29, text:'Hello',          emoji:'\uD83C\uDF19'  }   // 21:00-04:59  moon
  ];

  function greetingBand(now = new Date()) {
    const h = now.getHours();
    // 21:00-04:59 wraps midnight, so hours before 5 are read as 24+h.
    const hh = h < 5 ? h + 24 : h;
    return GREETINGS.find(g => hh >= g.from && hh < g.to) || GREETINGS[0];
  }

  const greeting = () => greetingBand().text;

  // ===================================================================
  // RENDER
  // ===================================================================
  const $ = sel => document.querySelector(sel);


  // The account control travels with the page rather than sitting in a bar:
  // beside the greeting on the dashboard, beside the back link on a step.
  function profileHtml() {
    return `<div class="profile">
      <button class="avatar" id="profileBtn" aria-haspopup="true" aria-expanded="${state.menuOpen}" aria-label="Your account">
        <span>${esc(USER.initials)}</span>
      </button>
      <div class="menu ${state.menuOpen ? '' : 'hide'}" id="profileMenu" role="menu">
        <div class="menu-h">
          <div class="avatar sm" aria-hidden="true"><span>${esc(USER.initials)}</span></div>
          <div>
            <div style="font-weight:600">${esc(USER.name)}</div>
            <div class="muted" style="font-size:11px">${esc(isAdmin() ? ROLES.admin : ROLES.planner)} — ${esc(myName())}</div>
          </div>
        </div>
        <div class="menu-unit">
          <span class="label">Plant you plan</span>
          <select id="unitPick">
            ${UNITS.map(u => `<option value="${u.code}" ${u.code === state.myUnit ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}
          </select>
          <span class="muted" style="font-size:11px">Every other plant is read-only. Access comes from Dynamics.</span>
        </div>
        <div class="menu-unit" style="padding-top:0">
          <span class="label">Roles held <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— demo only</span></span>
          <select id="rolePick">
            <option value="planner,admin" ${isAdmin() ? 'selected' : ''}>${ROLES.admin} — plans and administers</option>
            <option value="planner" ${isAdmin() ? '' : 'selected'}>${ROLES.planner} — plans only</option>
          </select>
        </div>
        <div class="menu-sep"></div>
        <button class="menu-i" role="menuitem" data-settings="auto">Settings</button>
      </div>
    </div>`;
  }



  // The four steps appear as circles across the top of the work area once the
  // cycle is under way — they are the progress indicator, and the way back.

  // Loading sits over the page rather than replacing it, so the screen you came
  // from stays visible behind and nothing jumps around when it clears.
  function renderOverlay() {
    const host = $('#overlayHost');
    if (!state.fcLoading) { host.innerHTML = ''; return; }
    host.innerHTML = `
      <div class="overlay" role="status" aria-live="polite">
        <div class="overlay-card">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <div class="loadtxt">${esc(state.fcLoading.msg || 'Reading ' + state.fileName)}</div>
        </div>
      </div>`;
  }

  const infoMark = text => `<span class="tip tip-sm">
    <span class="tip-b" aria-hidden="true">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="7.6"/><path d="M10 9.2v4.4"/><circle cx="10" cy="6.5" r=".55" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span class="tip-c" role="tooltip">${esc(text)}</span>
  </span>`;

  const infoTip = text => `<span class="tip">
    <button class="tip-b" aria-label="More about this" aria-describedby="">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="7.6"/><path d="M10 9.2v4.4"/><circle cx="10" cy="6.5" r=".55" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <span class="tip-c" role="tooltip">${esc(text)}</span>
  </span>`;

  function stepperHtml() {
    if (state.step === 0) return '';
    // A page is not a step, so it gets the way back but not the progress track —
    // showing five planning steps on it would imply it is one of them.
    if (isPage(state.step)) return `<div class="stephead">
      <div class="steptop" style="margin-bottom:0">
        <button class="btn btn-s btn-ghost" data-step="0">← Dashboard</button>
      </div>
    </div>`;
    return `<div class="stephead">
    <div class="steptop">
      <button class="btn btn-s btn-ghost" data-step="0">← Dashboard</button>
      <span class="muted">${esc(myName())} · September 2026</span>
    </div>
    <ol class="stepper">
      ${STEPS.map(st => {
        const done = stepDone(st.n);
        const cur = st.n === state.step;
        const locked = st.n > state.maxStep;
        return `<li class="stp ${done ? 'done' : ''} ${cur ? 'cur' : ''} ${locked ? 'lock' : ''}">
          <button class="stp-b" ${locked ? 'disabled' : ''} data-step="${st.n}"
            aria-current="${cur}" aria-label="Step ${st.n}, ${st.t}${done ? ', done' : locked ? ', not yet available' : ''}">
            <span class="stp-c">${done && !cur ? '✓' : st.n}</span>
            <span class="stp-l"><span class="stp-t">${st.t}</span><span class="stp-s">${st.s}</span></span>
          </button>
        </li>`;
      }).join('')}
    </ol>
    </div>`;
  }

  function stepDone(n) {
    if (n === STEP_FORECAST) return !!state.forecast;
    if (n === STEP_ITEMS) return !!state.forecast && state.maxStep > STEP_ITEMS;
    if (n === STEP_RUN) return !!(state.run && state.run.done);
    if (n === STEP_REVIEW) return state.lines != null && flagged().length > 0 && Object.keys(state.decisions).length >= flagged().length;
    return false;
  }


  // Where the cycle actually is, and the single next thing to do.
  function cycleState() {
    if (!state.forecast) return { k:'not-started', title:'Not started', detail:'The forecast from Sales has not been loaded yet.', cta:'Start the cycle', step:STEP_FORECAST };
    if (!state.run || !state.run.done) return { k:'ready-to-run', title:'Forecast loaded', detail:`Version ${state.forecastVersion} is locked and ready. The requirement engine has not run.`, cta:'Check the item master', step:STEP_ITEMS };
    const f = flagged(), d = Object.keys(state.decisions).length;
    if (d < f.length) return { k:'review', title:`${f.length - d} lines to decide`, detail:`${cleared().length} lines cleared automatically and need no decision.`, cta:'Continue review', step:STEP_REVIEW };
    return { k:'complete', title:'Ready for demand orders', detail:`All ${f.length} flagged lines decided. ${cleared().length} cleared automatically.`, cta:'Create demand orders', step:STEP_ORDERS };
  }

  function go(n) {
    state.step = n;
    render();
    window.scrollTo(0, 0);
  }

  // Redrawn on every pass so the avatar and the settings state stay in step
  // with the rest of the page; wire() re-binds both afterwards.
  const THEME_ICONS = {
    light: '<circle cx="10" cy="10" r="3.4"/><path d="M10 1.6v2.2M10 16.2v2.2M18.4 10h-2.2M3.8 10H1.6M16 4l-1.6 1.6M5.6 14.4 4 16M16 16l-1.6-1.6M5.6 5.6 4 4"/>',
    dark: '<path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9Z"/>',
    system: '<rect x="2.5" y="4" width="15" height="10.5" rx="2"/><path d="M7 17.5h6"/>'
  };
  const themeNote = k => k === 'light' ? 'Light' : k === 'dark' ? 'Dark' : 'Following your system';

  // Everything the planner would want chasing, read off the state that is
  // already there — nothing here is a separate notification store. Each one
  // names the screen that resolves it, because a notice you cannot act on is
  // just a worry.
  function notifications() {
    const out = [];
    const iss = forecastIssueCounts();

    if (!state.forecast) {
      out.push({ tone:'flag', t:'This cycle\'s forecast is not loaded',
                 s:'Sales send one file per cycle. Nothing can be planned until it is in.', step: STEP_FORECAST });
    }
    if (iss && iss.quarantined) {
      out.push({ tone:'crit', t:`${iss.quarantined} forecast rows quarantined`,
                 s:'They carry no demand, so nothing under them will be ordered.', step: STEP_FORECAST });
    }
    if (iss && iss.warning) {
      out.push({ tone:'flag', t:`${iss.warning} rows had a blank month read as zero`,
                 s:'Check these against what Sales meant to send.', step: STEP_FORECAST });
    }

    const gaps = MATERIALS.filter(m => m.unit === state.myUnit && inScope(m) && gapsOf(m).length);
    if (gaps.length) {
      out.push({ tone:'flag', t:`${gaps.length} materials missing planning data`,
                 s:'Flagged, not blocked — the engine falls back to defaults.', step: STEP_ITEMS });
    }

    if (state.lines) {
      const undecided = flagged().length - Object.keys(state.decisions).length;
      if (undecided > 0) {
        out.push({ tone:'flag', t:`${undecided} lines need your decision`,
                   s:'The rest cleared every tolerance on their own.', step: STEP_REVIEW });
      }
    }

    const close = LAST_CLOSE[state.myUnit];
    const ago = close ? daysSince(close) : null;
    if (ago != null && ago > 14) {
      out.push({ tone:'mute', t:`Inventory last closed ${ago} days ago`,
                 s:'Every cover figure on the dashboard is only as fresh as that close.' });
    }
    return out;
  }

  function notifPanelHtml(items) {
    return `<div class="menu notif ${state.notifOpen ? '' : 'hide'}" id="notifPanel" role="dialog" aria-label="Notifications">
      <div class="notif-h">Needs a look${items.length ? ` · ${items.length}` : ''}</div>
      ${items.length ? items.map((n, i) => `
        <button class="notif-i" ${n.step ? `data-notif-step="${n.step}"` : ''}>
          <span class="notif-t">
            <span class="notif-dot" style="background:${n.tone === 'crit' ? 'var(--crit)' : n.tone === 'flag' ? 'var(--flag-fill)' : 'var(--line-strong)'}"></span>
            ${esc(n.t)}
          </span>
          <span class="notif-s">${esc(n.s)}</span>
        </button>`).join('')
        : `<div class="notif-none">✅ Nothing waiting on you</div>`}
    </div>`;
  }

  function renderRail() {
    const next = THEMES[(THEMES.findIndex(t => t.k === state.theme) + 1) % THEMES.length];
    const notes = notifications();
    $('#railHost').innerHTML = `
      <div class="rail-pill">
      <button class="rail-b ${state.step === 0 ? 'on' : ''}" data-step="0"
        aria-label="Dashboard" aria-current="${state.step === 0}" title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1.4"/>
          <rect x="14" y="3" width="7" height="5" rx="1.4"/>
          <rect x="14" y="12" width="7" height="9" rx="1.4"/>
          <rect x="3" y="16" width="7" height="5" rx="1.4"/>
        </svg>
      </button>
      <button class="rail-b ${state.step === PAGE_SETTINGS ? 'on' : ''}" id="railSettings"
        aria-label="Settings" aria-pressed="${state.step === PAGE_SETTINGS}" title="Settings">
        <!-- A toothed cog, not the circle-and-rays mark that was here before —
             that one was a sun, and sat one button away from the light-mode sun. -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button class="rail-b" id="railTheme"
        aria-label="Colour mode: ${esc(themeNote(state.theme))}. Switch to ${esc(next.t.toLowerCase())}."
        title="${esc(themeNote(state.theme))} — click for ${esc(next.t.toLowerCase())}">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          ${THEME_ICONS[state.theme]}
        </svg>
      </button>
      <div class="profile">
        <button class="rail-b ${state.notifOpen ? 'on' : ''}" id="railNotif"
          aria-haspopup="dialog" aria-expanded="${state.notifOpen}"
          aria-label="Notifications${notes.length ? `, ${notes.length} waiting` : ', nothing waiting'}"
          title="Notifications">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.2 13.2V8.6a5.2 5.2 0 1 0-10.4 0v4.6L3.4 15.2h13.2l-1.4-2Z"/>
            <path d="M8.1 17.4a2 2 0 0 0 3.8 0"/>
          </svg>
          ${notes.length ? `<span class="rail-dot">${notes.length}</span>` : ''}
        </button>
        ${notifPanelHtml(notes)}
      </div>
      </div>
      <div class="rail-solo">${profileHtml()}</div>`;
  }

  function render() {
    renderOverlay();
    renderRail();
    const m = $('#main');
    const body = state.step === 0 ? viewDashboard()
      : state.step === PAGE_METRICS ? viewMetrics()
      : state.step === PAGE_VERSIONS ? viewVersions()
      : state.step === PAGE_CYCLES ? viewCycles()
      : state.step === PAGE_SETTINGS ? viewSettings()
      : state.step === STEP_FORECAST ? viewForecast()
      : state.step === STEP_ITEMS ? viewItemMaster()
      : state.step === STEP_RUN ? viewRun()
      : state.step === STEP_REVIEW ? viewReview()
      : viewOrders();
    m.innerHTML = stepperHtml() + body;
    wire();
    renderDrawer();
    renderStockDrawer();
    renderReqDrawer();
  }


  // ===================================================================
  // SETTINGS
  // ===================================================================
  const ALL_SETTINGS_TABS = [
    { k:'logic',      t:'Calculation rules',          admin:true },
    { k:'thresholds', t:'When something comes to me', admin:false, hidden:true },
    { k:'units',      t:'Plants I look after',        admin:false },
    { k:'accuracy',   t:'Forecast accuracy',          admin:false },
    { k:'audit',      t:'Change log',                 admin:true }
  ];
  const settingsTabs = () => ALL_SETTINGS_TABS.filter(t => !t.hidden && (!t.admin || isAdmin()));

  // Settings on their own page rather than in a drawer: the change log and the
  // rule editor are things you sit with, and a 660px panel sliding over the
  // work is the wrong shape for either.
  function viewSettings() {
    const tabs = settingsTabs();
    const cur = tabs.find(t => t.k === state.settings) || tabs[0];
    return `
      <div class="pagehead">
        <div class="hello"><div>
          <h2 class="greet">Settings</h2>
          <p class="greet-s">${esc(cur ? cur.t : '')}</p>
        </div></div>
      </div>

      <div class="chips">
        ${tabs.map(t => `<button class="chip ${t.k === (cur || {}).k ? 'on' : ''}" data-settab="${t.k}">
          ${esc(t.t)}${t.admin ? '<span class="chip-a">admin</span>' : ''}
        </button>`).join('')}
      </div>

      <div class="setbody">${settingsBody()}</div>
    `;
  }

  function settingsBody() {
    // Role is re-checked here, not just when drawing the menu — the gate has to
    // hold even if someone reaches the panel another way.
    const tab = ALL_SETTINGS_TABS.find(t => t.k === state.settings);
    if (tab && tab.admin && !isAdmin()) return bodyDenied();
    if (tab && tab.hidden) return bodyUnits();
    if (state.settings === 'audit') return bodyAudit();
    if (state.settings === 'logic') return bodyLogic();
    if (state.settings === 'thresholds') return bodyThresholds();
    if (state.settings === 'units') return bodyUnits();
    return bodyAccuracy();
  }


  function bodyDenied() {
    return `
      <div class="prev bad">
        <div class="label">Not part of your access</div>
        <div style="font-weight:600;margin-top:2px">This needs the Admin role.</div>
        <div class="muted" style="font-size:11.5px;margin-top:4px">
          You hold ${state.roles.map(r => ROLES[r]).join(' and ') || 'no planning role'}.
          Roles are granted in Dynamics, not here — ask Group Digital &amp; Technology if you need this.
        </div>
      </div>
      <div class="note">
        Calculation rules are deliberately kept apart from planning. A planner runs and reviews their own plant. Changing how a number is worked out is the one thing the admin role adds — it grants no extra plants and no extra data.
      </div>`;
  }


  // How many materials a rule would land on, at the scope chosen.
  function scopeCount() {
    const m = MATERIALS.find(x => x.code === state.sampleCode) || MATERIALS[0];
    if (state.logicScope === 'material') return 1;
    const inMine = MATERIALS.filter(x => x.unit === state.myUnit && inScope(x));
    if (state.logicScope === 'category') return inMine.filter(x => x.cat === m.cat).length;
    return inMine.length;
  }

  function bodyLogic() {
    const m = MATERIALS.find(x => x.code === state.sampleCode) || MATERIALS[0];
    const fc = FORECAST.find(f => f.fg === m.fg);
    const vars = varsFor(m, fc);
    const used = ALL_TOKENS.filter(t => new RegExp('\\b' + t + '\\b').test(state.formula.toUpperCase()));

    return `
      <div class="note">
        <strong>Logic 1 and Logic 2 are built in and cannot be changed.</strong> They cover almost everything.
        Need something close to one of them but not quite? Start a new rule from a copy below — the copy is yours to edit; the original never changes.
      </div>

      <div class="trail">
        <div class="trail-row">
          <div><div class="t">Made for one product</div>
            <div class="e">forecast for that product, through the recipe, less what we hold and what is on order</div></div>
          <div><span class="pill p-mute">built in</span></div>
        </div>
        <div class="trail-row">
          <div><div class="t">Used across many products</div>
            <div class="e">enough to cover the wait for delivery plus a safety margin, less what we hold and what is on order</div></div>
          <div><span class="pill p-mute">built in</span></div>
        </div>
      </div>

      <div class="sep"></div>

      <label style="display:block">
        <span class="label">Start from a copy</span>
        <select id="fCopyFrom" style="width:100%;margin-top:5px">
          <option value="">— write from scratch —</option>
          <option value="L1">Logic 1 — made for one product</option>
          <option value="L2">Logic 2 — used across many products</option>
          ${state.customRules.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}
        </select>
      </label>

      <div class="grid2" style="margin-top:12px">
        <label style="display:block">
          <span class="label">Name of your rule</span>
          <input type="text" id="fName" value="${esc(state.formulaName)}" style="width:100%;margin-top:5px">
        </label>
        <label style="display:block">
          <span class="label">Apply it to</span>
          <select id="fScope" style="width:100%;margin-top:5px">
            <option value="material" ${state.logicScope === 'material' ? 'selected' : ''}>Just this material</option>
            <option value="category" ${state.logicScope === 'category' ? 'selected' : ''}>Every ${esc(m.cat.toLowerCase())} at ${esc(myName())}</option>
            <option value="unit" ${state.logicScope === 'unit' ? 'selected' : ''}>Everything at ${esc(myName())}</option>
          </select>
        </label>
      </div>

      <div>
        <div class="label" style="margin-bottom:5px">Your rule</div>
        <textarea id="fSrc" rows="3" spellcheck="false" class="fsrc">${esc(state.formula)}</textarea>
        <div class="rowflex" style="margin-top:7px">
          ${['+', '−', '×', '÷', '(', ')'].map(o => `<button class="btn btn-s" data-ins="${o === '−' ? '-' : o === '×' ? '*' : o === '÷' ? '/' : o}">${o}</button>`).join('')}
          ${['MIN', 'MAX', 'ROUNDUP', 'ROUND', 'ABS'].map(fn => `<button class="btn btn-s" data-ins="${fn}(">${fn}</button>`).join('')}
        </div>
      </div>

      <div>
        <div class="label" style="margin-bottom:5px">Values you can use — click to add</div>
        ${Object.entries(TOKEN_GROUPS).map(([g, toks]) => `
          <div style="margin-bottom:7px">
            <div class="muted" style="font-size:11px;margin-bottom:3px">${g === 'Demand' ? 'From the forecast' : g === 'Consumption' ? 'From past usage' : g === 'Parameters' ? 'From the item record' : 'What we have now'}</div>

  function metricTile(m, compact) {
    // Only the two off-target tones tint the whole card, matching the stock

    // and the two that need attention would stop standing out at all.
    const fill = m.tone === 'crit' ? ' card-crit' : m.tone === 'flag' ? ' card-warn' : '';

    const colour = m.tone === 'crit' ? 'var(--crit)' : m.tone === 'flag' ? 'var(--flag)'
      : m.tone === 'good' ? 'var(--good)' : 'var(--faint)';
    return `<div class="card mcard m-${m.tone}${fill}">

      ${compact ? '' : `<div class="md">${esc(m.d)}</div>`}

  }

  // Line-by-line difference between two accepted versions, keyed on FG code.
  // Quantity changes are reported per month and as a percentage of the older
  // figure, because "up 60" means nothing without knowing it was 40 or 4,000.
  function diffVersions(a, b) {
    const byFg = v => { const m = {}; (v ? v.rows : []).forEach(r => m[r.fg] = r); return m; };
    const A = byFg(a), B = byFg(b);
    const codes = [...new Set([...Object.keys(A), ...Object.keys(B)])].sort();
    const out = { added: [], removed: [], changed: [], same: 0 };
    codes.forEach(fg => {
      const x = A[fg], y = B[fg];
      if (!x) { out.added.push(y); return; }
      if (!y) { out.removed.push(x); return; }
      const months = ['m0', 'm1', 'm2'].map(k => ({
        k, from: x[k] || 0, to: y[k] || 0, d: (y[k] || 0) - (x[k] || 0)
      })).filter(m => m.d !== 0);
      if (months.length) out.changed.push({ fg, desc: y.desc || x.desc, unit: y.unit, months });
      else out.same++;
    });
    return out;
  }

    const delta = prev == null ? 0 : sel - prev;
    const sorted = rows.slice().sort((a, b) => accuracyAt(a, state.accCycle) - accuracyAt(b, state.accCycle));

    return `
      <div class="rowflex" style="justify-content:space-between">

  // Called from wire(), since the settings body is part of the page now.
  function wireSettings() {
    const host = $('#main');
    if (!host) return;
    const src = $('#fSrc');
    if (src) {
      src.oninput = () => { state.formula = src.value; refreshPreview(); };
      host.querySelectorAll('[data-ins]').forEach(b => b.onclick = () => {
        const t = b.dataset.ins;
        const pos = src.selectionStart ?? state.formula.length;
        const pad = /[A-Z_(]/.test(t[0]) ? '' : ' ';
        state.formula = state.formula.slice(0, pos) + pad + t + pad + state.formula.slice(src.selectionEnd ?? pos);
        render();
        const el = $('#fSrc');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
    }
    const copyFrom = $('#fCopyFrom'); if (copyFrom) copyFrom.onchange = () => {
      const id = copyFrom.value;
      if (!id) return;
      if (id === 'L1' || id === 'L2') {
        state.formula = PREDEF_FORMULAS[id];
        state.formulaName = `Copy of ${id === 'L1' ? 'Logic 1' : 'Logic 2'}`;
      } else {
        const src = state.customRules.find(r => r.id === id);
        if (!src) return;
        state.formula = src.formula;
        state.formulaName = `Copy of ${src.name}`;
      }
      render();
    };
    const name = $('#fName'); if (name) name.oninput = () => { state.formulaName = name.value; };
    const sample = $('#fSample'); if (sample) sample.onchange = () => { state.sampleCode = sample.value; render(); };
    const scope = $('#fScope'); if (scope) scope.onchange = () => { state.logicScope = scope.value; render(); };
    host.querySelectorAll('[data-delrule]').forEach(b => b.onclick = () => {
      state.customRules = state.customRules.filter(r => r.id !== b.dataset.delrule);
      if (state.lines) recalc();
      render();
      render();
    });
    const reset = $('#fReset'); if (reset) reset.onclick = () => {
      state.formula = '(LEAD_TIME * DAILY_REQ) + (SAFETY_DAYS * DAILY_REQ) - SOH - OPEN_PO';
      render();
    };
    const save = $('#fSave'); if (save) save.onclick = () => {
      const m = MATERIALS.find(x => x.code === state.sampleCode) || MATERIALS[0];
      const target = state.logicScope === 'material' ? m.code
        : state.logicScope === 'category' ? state.myUnit + '|' + m.cat
        : state.myUnit;
      // One rule per (scope, target) — saving again replaces it.
      const prevRule = state.customRules.find(r => r.scope === state.logicScope && r.target === target);
      state.customRules = state.customRules.filter(r => !(r.scope === state.logicScope && r.target === target));
      logChange('rule', `Calculation rule "${state.formulaName || 'My rule'}" (${state.logicScope})`,
        prevRule ? prevRule.formula : 'none', state.formula, `${fmt(scopeCount())} materials`);
      state.customRules.push({
        id: 'C' + (state.ruleSeq += 1),
        name: state.formulaName || 'My rule',
        formula: state.formula,
        scope: state.logicScope,
        target,
        built: false
      });
      if (state.lines) recalc();
      save.textContent = `Saved — applies to ${fmt(scopeCount())} material${scopeCount() === 1 ? '' : 's'}`;
      save.disabled = true;
      setTimeout(() => { render(); }, 1200);
    };
    const cov = $('#setCover'); if (cov) cov.onchange = () => {
      const before = Math.round(CONFIG.coverRatio * 100);
      CONFIG.coverRatio = Math.min(1, Math.max(0.05, (+cov.value || 25) / 100));
      const flaggedBefore = state.lines ? flagged().length : null;
      if (state.lines) recalc();
      logChange('threshold', 'Cover threshold', before + '%', Math.round(CONFIG.coverRatio * 100) + '%',
        flaggedBefore == null ? 'not yet calculated'
          : `${fmt(MATERIALS.filter(inScope).length)} materials · flagged ${flaggedBefore} → ${flagged().length}`);
    };
    const buf = $('#setBuffer'); if (buf) buf.onchange = () => {
      const before = CONFIG.safetyBufferFactor;
      CONFIG.safetyBufferFactor = Math.max(0, +buf.value || 0);
      if (state.lines) recalc();
      logChange('threshold', 'Safety buffer factor', before, CONFIG.safetyBufferFactor,
        `${fmt(MATERIALS.filter(inScope).length)} materials`);
    };
    host.querySelectorAll('[data-cycle]').forEach(b => b.onclick = () => { state.accCycle = +b.dataset.cycle; render(); });
  }

  }

  function unitCycle(code) {
    const mats = MATERIALS.filter(m => m.unit === code && inScope(m));
    if (code !== state.myUnit && SEED_PLANTS[code]) return { ...SEED_PLANTS[code], mats: mats.length, sample: true };
    if (!state.forecast) return { k:'no-forecast', label:'Forecast not loaded', tone:'p-mute', mats: mats.length, flagged:0, decided:0 };
    if (!state.lines) return { k:'not-run', label:'Not calculated', tone:'p-info', mats: mats.length, flagged:0, decided:0 };
    const lines = state.lines.filter(l => l.m.unit === code && !l.excluded);
    const flag = lines.filter(isFlag);
    const decided = flag.filter(l => state.decisions[l.m.code]).length;
    if (!flag.length) return { k:'clear', label:'Nothing flagged', tone:'p-good', mats: mats.length, flagged:0, decided:0 };
    if (decided >= flag.length) return { k:'done', label:'All decided', tone:'p-good', mats: mats.length, flagged: flag.length, decided };
    return { k:'review', label:`${flag.length - decided} to decide`, tone:'p-flag', mats: mats.length, flagged: flag.length, decided };
  }

  function viewDashboard() {
    if (state.loading) return viewDashboardLoading();
    const cs = cycleState();
    const ran = !!state.lines;
    const f = ran ? flagged() : [];
    const c = ran ? cleared() : [];
    const decided = Object.keys(state.decisions).length;

    const unitsWithData = [...new Set(MATERIALS.filter(inScope).map(m => m.unit))];

    // Stock, in plain terms: what we hold and roughly how long it lasts.
    // Quantity is grouped by UOM rather than summed across it, same reasoning
    // as "Quantity to order" — a bag count and a kilogram count are not the
    // same number, so they are shown as separate lines, not one blended total.
    const byUom = items => {
      const m = {};
      items.forEach(([uom, qty]) => { m[uom] = (m[uom] || 0) + qty; });
      return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([uom, q]) => `${fmt(q)} ${uom}`);
    };

    const myFg = FG_STOCK.filter(g => g.unit === state.myUnit);
    const fgVal = myFg.reduce((a, g) => a + g.qty * g.price, 0);
    const fgOff = myFg.reduce((a, g) => a + g.offtake * g.price, 0);
    const fgQty = byUom(myFg.map(g => [g.uom, g.qty]));

    const group = cats => {
      const ms = MATERIALS.filter(m => cats.includes(m.cat) && m.unit === state.myUnit);
      const val = ms.reduce((a, m) => a + m.soh * m.price, 0);
      const off = ms.reduce((a, m) => a + mean(lastN(m.cons, 3)) * m.price, 0);
      const qty = byUom(ms.map(m => [m.uom, m.soh]));
      return { val, days: off > 0 ? (val / off) * 30 : 0, qty };
    };
    const rm = group(['Raw Material', 'Chemical']);
    const pm = group(['Packaging']);

    const fgDays = fgOff > 0 ? (fgVal / fgOff) * 30 : 0;
    const fgStatus = coverStatus(fgDays);
    const rmStatus = coverStatus(rm.days);
    const pmStatus = coverStatus(pm.days);

    // Quantity to order, grouped by UOM rather than summed across it — a bag
    // count and a kilogram count are not the same number.
    const qtyByUom = {};
    if (ran) {
      [...f, ...c].forEach(l => {
        qtyByUom[l.m.uom] = (qtyByUom[l.m.uom] || 0) + l.prQty;
      });
    }
    const qtyParts = Object.entries(qtyByUom)
      .sort((a, b) => b[1] - a[1])
      .map(([uom, q]) => `${fmt(q)} ${uom}`);

    // Availability, measured rather than asserted: the share of this plant's
    // planned lines whose days of cover clear their own lead-time floor. Not the
    // programme's Stock availability KPI — that one counts stock-outs at the
    // point of production, which this app cannot see. This is the part the app
    // does know, scoped to the plant like the three cards beside it.
    const covLines = ran ? [...f, ...c] : [];
    const covShort = covLines.filter(l => l.toi < coverFloor(l.m));
    const covOk = covLines.length - covShort.length;
    const covPct = covLines.length ? Math.round(covOk / covLines.length * 100) : null;
    // What the gap costs: the requirement already calculated against the lines
    // that are short. The stock value of a thin line is small by definition —
    // the money that matters is what it takes to put the cover back.
    const covVal = covShort.reduce((a, l) => a + l.prValue, 0);
    const covOver = covLines.filter(l => l.toi > COVER_BANDS.overCovered).length;
    // Median rather than mean: one 12-month import would drag an average up and
    // make a plant that is mostly running thin look comfortable.
    const covSorted = covLines.map(l => l.toi / 30).sort((a, b) => a - b);
    const covMonths = covSorted.length
      ? (covSorted.length % 2 ? covSorted[(covSorted.length - 1) / 2]
        : (covSorted[covSorted.length / 2 - 1] + covSorted[covSorted.length / 2]) / 2)
      : null;

    const myGaps = MATERIALS.filter(m => m.unit === state.myUnit && inScope(m) && gapsOf(m).length);
    const close = LAST_CLOSE[state.myUnit];
    const closeAgo = close ? daysSince(close) : null;

    const accRows = ACCURACY.filter(r => unitsWithData.includes(r.unit));
    const sel = overallAt(accRows, state.accCycle);
    const prev = state.accCycle > 0 ? overallAt(accRows, state.accCycle - 1) : null;
    const delta = prev == null ? 0 : sel - prev;

    // What the button says, in words rather than process names.
    const START = {
      'not-started': { h:'Ready to start September planning', p:'', b:'Start Planning', tone:'good' },
      'ready-to-run': { h:'Forecast is in and locked',
                        p:'Next, work out what to buy — about a minute.',
                        b:'Check the item master', tone:'good' },
      'review': { h:`${c.length} items sailed through on their own`,
                  p:`${f.length - decided} need a quick call from you.`,
                  b:'Look at them', tone:'flag' },
      'complete': { h:'All set — ready to order',
                    p:`You decided ${f.length}. The other ${c.length} went through on their own.`,
                    b:'See the order list', tone:'good' }
    }[cs.k];

    return `
      <div class="pagehead">
        <div class="hello">
          <div>
            <h2 class="greet">${greetingBand().text}, ${esc(USER.short)} <span class="greet-e" aria-hidden="true">${greetingBand().emoji}</span></h2>
            <p class="greet-s">${new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}
              <span class="pill p-info plant-tag">${esc(myName())}</span></p>
          </div>

  // Version history for the forecast file. Shared between the dashboard and the
  // Forecast step so the two can never show different data for the same thing.
  // What the current file did on the way in. A forecast can be locked and still

  // that out was to open step 1 — a dashboard that says "Current · locked" and
  // nothing else reads as "all fourteen rows are in", which is not what happened.
  function forecastIssueCounts() {
    const map = state.map || {};
    if (!state.raw || !['fg', 'unit', 'm0', 'm1', 'm2'].every(k => map[k])) return null;
    const res = validateRows(state.raw, map);
    const n = o => res.filter(r => r.out === o).length;
    return { total: res.length, quarantined: n('quarantined'), corrected: n('corrected'), warning: n('warning') };
  }

  function forecastHistoryHtml(opts) {
    const linkable = !opts || opts.linkToStep !== false;
    const iss = forecastIssueCounts();

    // nothing to say — a row of green "0 quarantined" pills is just noise.
    const issueLine = () => {
      if (!iss) return '';
      const parts = [];
      if (iss.quarantined) parts.push(`<span class="pill p-crit">${iss.quarantined} quarantined</span>`);
      if (iss.warning) parts.push(`<span class="pill p-flag">${iss.warning} read as zero</span>`);
      if (iss.corrected) parts.push(`<span class="pill p-info">${iss.corrected} corrected</span>`);
      if (!parts.length) return `<span class="muted" style="font-size:11px">✅ every row loaded cleanly</span>`;
      return parts.join(' ');
    };
    // Four columns, one line each: which forecast, what state it is in, which
    // run consumed it, when it arrived. Status is derived, never stored —
    // draft until a run uses it, locked once one has, and used once a newer
    // version has taken over as current.
    const rows = allVersions().map(v => ({
      version: vLabel(v), file: v.file, at: v.at,
      usedBy: v.usedBy ? `Planning run #${String(v.usedBy).padStart(2, '0')}` : null,
      status: !v.usedBy ? 'Draft' : (v.n === state.forecastVersion ? 'Locked' : 'Used'),
      live: v.n === state.forecastVersion
    }));
    if (!state.forecastVersion) {
      rows.push({ version: 'v' + nextVersionNo(), file: null, at: null, usedBy: null,
                  status: 'Not uploaded', live: false, pending: true });
    }
    const body = rows.slice().reverse().map(r => {
      const tag = linkable && r.file ? 'button' : 'div';
      const attrs = linkable && r.file ? 'data-goto-forecast="1"' : '';
      const tone = r.status === 'Locked' ? 'p-good' : r.status === 'Used' ? 'p-mute' : r.status === 'Draft' ? 'p-info' : 'p-mute';
      return `<${tag} class="uprow uplink" ${attrs}>
        <span>
          <span style="font-weight:600">${esc(r.version)}</span>
          ${r.file ? `<span class="upfile">${esc(r.file)}</span>` : ''}
        </span>
        <span><span class="pill ${tone}">${esc(r.status)}</span></span>
        <span class="muted">${r.usedBy ? esc(r.usedBy) : '\u2014'}</span>
        <span class="muted">${r.at ? esc(r.at.toLocaleDateString('en-GB', { day:'numeric', month:'short' })) : '\u2014'}</span>
      </${tag}>`;
    }).join('');
    return `

  function viewItemMaster() {
    const all = MATERIALS.filter(m => m.unit === state.myUnit);
    const q = state.imFilter.trim().toLowerCase();
    const withGaps = all.filter(m => inScope(m) && gapsOf(m).length);
    let rows = all.filter(m => !q || m.code.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q));
    if (state.imGapsOnly) rows = rows.filter(m => gapsOf(m).length);

    const options = m => {
      const own = state.customRules.filter(r =>
        (r.scope === 'material' && r.target === m.code) ||
        (r.scope === 'category' && r.target === m.unit + '|' + m.cat) ||
        (r.scope === 'unit' && r.target === m.unit));
      const list = [PREDEF.L1, PREDEF.L2, ...state.customRules];
      const cur = logicIdFor(m);
      return list.map(r => `<option value="${r.id}" ${r.id === cur ? 'selected' : ''}>${esc(r.name)}</option>`).join('') + (own.length ? '' : '');
    };

    return `
      <div class="head">
        <div>
          <h2>Item master — ${esc(myName())}</h2>
          <p>The rule the engine uses for each material, and the numbers it needs. Held per item, so the same rule is applied every month rather than remembered by whoever runs it.</p>
        </div>
      </div>

      ${withGaps.length ? `
      <div class="ro-note" style="background:var(--flag-soft)">
        <span class="pill p-flag">${withGaps.length}</span>
        <span><strong>${withGaps.length} material${withGaps.length === 1 ? '' : 's'} missing something.</strong>
        The run still completes — these lines get flagged for you rather than blocking it.</span>
        <span style="flex:1"></span>
        <button class="btn btn-s" id="imGaps">${state.imGapsOnly ? 'Show all' : 'Show only these'}</button>
      </div>` : ''}

      <div class="panel">
        <div class="panel-h">
          <div class="rowflex">
            <input type="text" id="imSearch" placeholder="Search code or description" value="${esc(state.imFilter)}" style="width:260px">
          </div>
          <span class="muted">${rows.length} of ${all.length} shown</span>
        </div>
        <div class="scroll"><table>
          <thead><tr>
            <th>Material</th><th>Cat</th><th>UOM</th><th>Rule</th>
            <th class="r">Lead (d)</th><th class="r">Safety (d)</th><th class="r">Horizon (d)</th><th class="r">MOQ</th>
            <th class="r">Bundle</th><th class="r">Pallet</th><th class="r">Cost</th>
          </tr></thead>
          <tbody>
            ${rows.length === 0 ? '<tr><td colspan="10" style="text-align:center;padding:26px" class="muted">Nothing matches.</td></tr>' : ''}
            ${rows.map(m => {
              const g = gapsOf(m);
              const out = !inScope(m);
              return `<tr>
                <td>
                  <div style="font-weight:550">${esc(m.desc)}</div>
                  <div class="cell-code muted">${esc(m.code)}</div>
                </td>
                <td><span class="pill p-mute">${m.cat === 'Packaging' ? 'PM' : m.cat === 'Chemical' ? 'CH' : 'RM'}</span></td>
                <td class="muted">${esc(m.uom)}</td>
                <td>
                  ${out
                    ? `<span class="pill p-mute" title="tag ${m.tag}">not planned</span>`
                    : `<select data-logic="${m.code}" ${isAdmin() ? '' : 'disabled title="Only the planning admin can change this"'}>${options(m)}</select>`}
                </td>
                <td class="r"><input type="number" class="cell-in" data-p="lt" data-code="${m.code}" value="${m.lt}"></td>
                <td class="r"><input type="number" class="cell-in" data-p="safety" data-code="${m.code}" value="${m.safety}"></td>
                <td class="r num ${out ? 'muted' : ''}" title="Lead time + safety days">${out ? '—' : fmt(m.lt + m.safety)}</td>
                <td class="r num muted">${fmt(m.moq)}</td>
                <td class="r"><input type="number" class="cell-in ${m.bundle == null ? 'bad' : ''}" data-p="bundle" data-code="${m.code}"
                     value="${m.bundle == null ? '' : m.bundle}" placeholder="missing"></td>
                <td class="r num muted">${m.pallet == null ? '—' : fmt(m.pallet)}</td>
                <td class="r num muted">${m.price ? m.price.toFixed(2) : '—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>
      </div>

      <div class="note" style="margin-top:14px">
        <strong>Which copy wins?</strong> These parameters live on the Dynamics item master, but they are editable here.
        Edits made here are held as a local override with the Dynamics value kept alongside — so nothing is lost either way.
        Whether Dynamics or this app is the source of truth still needs deciding before build.
      </div>

      <div class="note" style="margin-top:10px">
        <strong>Horizon is held here, not chosen at run time.</strong> How far ahead to plan is lead time plus safety cover —
        it is not the same for every material, so it cannot be one setting on the run screen. Change lead time or safety
        days above and the horizon for that line updates with it.
      </div>

      ${isAdmin() ? `
      <div class="note" style="margin-top:10px">
        <strong>Logic 1 and Logic 2 are built in and cannot be edited.</strong>
        You have ${state.customRules.length} rule${state.customRules.length === 1 ? '' : 's'} of your own.
        <button class="btn btn-s btn-ghost" data-settings="logic">Create or edit a rule</button>
      </div>` : ''}

      <div class="step-bar">
        <button class="btn btn-p btn-lg btn-arrow step-b" id="toRun2">Work out the PR
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.5 10h13M11.5 5l5 5-5 5"/>
            </svg>
        </button>
          <div class="step-sub">
        <p class="step-n">${fmt(all.filter(inScope).length)} materials in scope${withGaps.length ? ` · ${withGaps.length} still missing planning data` : ' · nothing missing'}</p>
      </div>
        </div>
    `;
  }

  // ---------- STEP 3 — RUN ----------
  function viewRun() {
    const r = state.run;
    const unitsInPlay = [...new Set(MATERIALS.map(m => m.unit))];

    if (!r) {
      const mine = MATERIALS.filter(m => m.unit === state.myUnit);
      const inScopeN = mine.filter(inScope).length;
      const gaps = mine.filter(m => inScope(m) && m.bundle == null);
      const u = UNITS.find(x => x.code === state.myUnit);

      const check = (label, value, ok) => `
        <div class="chk">
          <span class="chk-i ${ok ? 'ok' : 'warn'}" aria-hidden="true">${ok ? '✓' : '!'}</span>
          <span class="chk-l">${esc(label)}</span>
          <span class="chk-v mono">${value}</span>
        </div>`;

      return `
        <div class="head">
          <div>
            <h2>Run the requirement calculation</h2>
            <p>Set the parameters, then generate. Nothing is committed — this produces a quantity for you to check.</p>
          </div>
        </div>

        <div class="runwrap">
          <div class="panel">
            <div class="panel-b">
              <div class="label" style="margin-bottom:8px;text-align:center">Plant in this run</div>
              <div class="unitrow">
                <div class="unittile on">
                  <div class="uc">${esc(u.code)}</div>
                  <div class="un">${esc(u.name)}</div>
                </div>
              </div>
              <div class="muted" style="font-size:11.5px;margin-top:9px;text-align:center">
                The other ${UNITS.length - 1} run on their own planners' cycles:
                ${UNITS.filter(x => x.code !== u.code)
                  .map(x => `<span class="unit-off" title="${esc(x.name)} — planned by its own planner">${esc(x.code)}</span>`)
                  .join('')}
              </div>

            </div>
          </div>
          <div class="step-bar">
            <button class="btn btn-p btn-lg btn-arrow step-b" id="startRun">Generate
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.5 10h13M11.5 5l5 5-5 5"/>
              </svg>
            </button>
          <div class="step-sub">
            <p class="step-n">1 plant · ${fmt(inScopeN)} materials · nothing is committed by running this</p>
            <button class="btn btn-s btn-ghost" id="startSim">Simulate — no order list</button>
          </div>
        </div>

          <div class="panel">
            <div class="panel-b">
              <div class="label" style="margin-bottom:10px">Before you run</div>
              ${check('Forecast version', state.forecastVersion ? `V${state.forecastVersion} locked` : 'none accepted', !!state.forecastVersion)}
              ${check('Stock on hand', syncAt().toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }), true)}
              ${check('Open purchase orders', syncAt().toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }), true)}
              ${check('Past usage', '12 mths to Aug', true)}
              ${(() => {
                const hs = MATERIALS.filter(m => m.unit === state.myUnit && inScope(m)).map(m => m.lt + m.safety);
                const lo = Math.min(...hs), hi = Math.max(...hs);
                return check('Horizon', `${lo === hi ? lo : lo + '–' + hi} days`, true);
              })()}
              ${check('Master data gaps', gaps.length ? fmt(gaps.length) + (gaps.length === 1 ? ' item' : ' items') : 'none', gaps.length === 0)}
              <div class="chk">
                <span class="chk-i ${state.pTrigger === 'close' ? 'ok' : 'warn'}">${state.pTrigger === 'close' ? '✓' : '!'}</span>
                <span class="chk-l">When to run</span>
                <select id="pTrigger" class="chk-sel">
                  <option value="close" ${state.pTrigger === 'close' ? 'selected' : ''}>After inventory close</option>
                  <option value="now" ${state.pTrigger === 'now' ? 'selected' : ''}>Start now</option>
                </select>
              </div>
              <p class="muted" style="font-size:11.5px;margin:14px 0 0">
                Stock and open orders reach this app through Synapse Link on a daily sync. They are current as at the timestamp above, not live from Dynamics.
                Horizon is each material's own lead time plus its safety days, held on the item master —
                <button class="btn btn-s btn-ghost" style="padding:2px 7px" data-goto-items="1">see the item master</button>
              </p>
              ${state.pTrigger === 'now' ? `<div class="note note-flag" style="margin-top:12px">
                Starting before inventory close means usage is a day behind. It keeps the full Week 1 window.
              </div>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    const elapsed = r.done ? r.total : (Date.now() - r.t0);
    const pct = Math.min(100, (elapsed / r.total) * 100);
    const stageState = i => {
      const per = r.total / r.stages.length, s = i * per;
      return elapsed >= s + per ? 'done' : elapsed >= s ? 'run' : '';
    };
    const unitState = i => {
      const fin = r.total * (0.6 + 0.4 * ((i + 1) / unitsInPlay.length));
      return elapsed >= fin ? 'done' : elapsed >= fin * 0.15 ? 'run' : '';
    };

    return `
      <div class="head">
        <div>
          <h2>${r.done ? 'Requirement generated' : 'Calculating…'}</h2>
          <p>${r.done ? (state.simulate ? 'Simulation finished — nothing will be turned into an order list. ' : '') + fmt(mineOnly(state.lines).length) + ' material lines calculated for ' + esc(myName()) + '.' : 'The engine is working through your plant.'}</p>
        </div>
        <div class="num" style="font-size:22px;font-weight:600">${(elapsed / 1000).toFixed(1)}s</div>
      </div>

      <div class="panel">
        <div class="panel-b">
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div style="margin-top:12px">
            ${r.stages.map((s, i) => `<div class="stage"><span class="dot ${stageState(i)}"></span><span class="${stageState(i) ? '' : 'muted'}">${esc(s)}</span></div>`).join('')}
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-h"><div><h3>Units</h3><p>Each unit runs on its own — one slow unit does not hold up the others.</p></div></div>
        <div class="panel-b" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">
          ${unitsInPlay.map((u, i) => {
            const st = unitState(i);
            return `<div class="rowflex" style="gap:7px"><span class="dot ${st}"></span><span class="${st ? '' : 'muted'}"><strong>${u}</strong> <span class="muted">${esc(UNITS.find(x => x.code === u)?.name || '')}</span></span></div>`;
          }).join('')}
        </div>
      </div>

      ${r.done ? `
      <div class="step-bar">
        <button class="btn btn-p btn-lg btn-arrow step-b" id="toReview">Review ${fmt(flagged().length)} flagged lines
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3.5 10h13M11.5 5l5 5-5 5"/>
            </svg>
        </button>
          <div class="step-sub">
        <p class="step-n">${fmt(cleared().length)} lines cleared every tolerance and need no decision</p>
      </div>
        </div>` : ''}
    `;
  }

  // ---------- STEP 3 ----------
  const mineOnly = ls => ls.filter(l => l.m.unit === state.myUnit);
  const isFlag = l => !l.excluded && l.exceptions.length > 0 &&
    (l.prQty > 0 || l.exceptions.includes('nodemand') || l.exceptions.includes('gap'));

  const flagged = () => mineOnly((state.lines || []).filter(isFlag));
  const cleared = () => mineOnly((state.lines || []).filter(l => !l.excluded && l.exceptions.length === 0));
  const excluded = () => mineOnly((state.lines || []).filter(l => l.excluded));
  // Other plants: same calculation, shown read-only.
  const othersFlagged = () => (state.lines || []).filter(l => isFlag(l) && l.m.unit !== state.myUnit);

  const TABS = [
    { k:'all', t:'All flagged' },
    { k:'cover', t:'Below cover' },
    { k:'space', t:'Quantity and space' },
    { k:'gap', t:'Data gaps' },
    { k:'nodemand', t:'No demand signal' }
  ];

  function viewReview() {
    const f = flagged(), c = cleared(), x = excluded();
    const decided = Object.keys(state.decisions).length;
    const prVal = f.reduce((a, l) => a + l.prValue, 0) + c.reduce((a, l) => a + l.prValue, 0);

    let rows = state.showOthers ? othersFlagged()
      : state.showCleared ? c
      : state.tab === 'all' ? f
      : f.filter(l => l.exceptions.includes(state.tab));
    // An admin can narrow to one plant; a planner has only their own anyway.
    if (isAdmin() && state.reviewUnit) rows = rows.filter(l => l.m.unit === state.reviewUnit);
    // Only worth a plant column when the rows actually span plants.
    const multiPlant = new Set(rows.map(l => l.m.unit)).size > 1;

    return `
      <div class="head">
        <div>
          <h2>Review — ${esc(myName())}</h2>
        </div>
        ${state.simulate ? `<span class="pill p-mute">Simulation — decide a line to make it live</span>` : ''}
      </div>

      ${state.wasSimulation ? `<div class="ro-note" style="background:var(--good-soft)">
        <span class="pill p-good">now live</span>
        <span>This started as a simulation. Deciding a line turned it into the live cycle for ${esc(myName())}, so it can go on to an order list.</span>
      </div>` : ''}

      <p class="sumline">
        <span><b style="color:var(--flag)">${fmt(f.length)}</b> flagged for you${decided ? ` · ${decided} decided` : ''}</span>
        <span><b style="color:var(--good)">${fmt(c.length)}</b> cleared automatically</span>
        <span><b>${aedM(prVal)}</b> PR value ${'\u00b7'} before your decisions</span>
        <span class="muted"><b>${fmt(x.length)}</b> excluded by tag</span>
      </p>

      <div class="panel">
        <div class="tabs">
          ${TABS.map(t => {
            const n = t.k === 'all' ? f.length : f.filter(l => l.exceptions.includes(t.k)).length;
            return `<button class="tab" role="tab" aria-selected="${!state.showCleared && state.tab === t.k}" data-tab="${t.k}">${t.t} <span class="c">${n}</span></button>`;
          }).join('')}
          <span style="flex:1"></span>
          ${isAdmin() ? `<label class="tab-filter">
            <span class="label" style="font-size:9.5px">Plant</span>
            <select id="reviewUnit">
              <option value="">All plants</option>
              ${UNITS.map(u => `<option value="${u.code}" ${state.reviewUnit === u.code ? 'selected' : ''}>${esc(u.code)} — ${esc(u.name)}</option>`).join('')}
            </select>
          </label>` : ''}
          <button class="tab" role="tab" aria-selected="${state.showCleared}" data-cleared="1">
            ${state.showCleared ? '← Back to flagged' : `Look at the ${c.length} cleared lines`}
          </button>
          <button class="tab" role="tab" aria-selected="${state.showOthers}" data-others="1">
            ${state.showOthers ? '← Back to my plant' : `Other plants (${othersFlagged().length})`}
          </button>
        </div>

        ${state.showCleared ? `<div class="panel-b" style="padding-bottom:0"><div class="note">
          <strong>Read-only.</strong> These lines met every tolerance, so they need no decision. Same calculation trail as any flagged line — open one to check the maths yourself.
        </div></div>` : ''}
        ${state.showOthers ? `<div class="panel-b" style="padding-bottom:0"><div class="note">
          <strong>Read-only — other plants.</strong> You plan ${esc(myName())}. These lines belong to planners at other plants, so you can see them and open the working, but you cannot decide them.
        </div></div>` : ''}

        <div class="scroll"><table>
          <thead><tr>
            <th>Material ${multiPlant ? '· plant' : ''}</th><th>Band</th>
            <th class="r">Cover</th><th class="r">On hand</th><th class="r">Open PO</th>
            <th class="r">Safety</th><th class="r">PR qty</th>
            <th>Supply schedule</th><th class="r">Value</th><th></th>
          </tr></thead>
          <tbody>
            ${rows.length === 0 ? `<tr><td colspan="10" style="text-align:center;padding:30px" class="muted">Nothing in this filter.</td></tr>` : ''}
            ${rows.map(l => {
              const d = state.decisions[l.m.code];
              const tone = l.exceptions.includes('gap') || l.exceptions.includes('nodemand') ? 'p-crit'
                : l.exceptions.includes('space') ? 'p-flag' : 'p-flag';
              const qtyShown = d && d.kind === 'override' ? d.qty : l.prQty;
              return `<tr>
                <td style="max-width:46ch">
                  <div class="cell-code">${esc(l.m.code)}${multiPlant ? ` · <span class="${canEdit(l) ? '' : 'muted'}">${esc(l.m.unit)}</span>` : ''}</div>
                  <div class="cell-desc">${esc(l.m.desc)}</div>
                  <div class="why">${l.reason ? esc(l.reason) : '<span class="pill p-good">within tolerance</span>'}</div>
                </td>
                <td>${l.m.band === 'weekly' ? '<span class="pill p-info">weekly</span>' : '<span class="pill p-mute">monthly</span>'}</td>
                ${(() => {
                  // Under its own lead-time floor, or sitting on more than the
                  // over-cover band — both are worth seeing on the line, not
                  // just the shortage.
                  const thin = l.toi < coverFloor(l.m);
                  const over = l.toi > COVER_BANDS.overCovered;
                  const tone = thin ? 'var(--crit)' : over ? 'var(--good)' : '';
                  return `<td class="r num ${tone ? '' : 'muted'}" ${tone ? `style="color:${tone};font-weight:600"` : ''}
                    title="${Math.round(l.toi)} days including open PO · lead time ${l.m.lt}d${thin ? ' · below its cover floor' : over ? ' · above the over-cover band' : ''}">
                    ${(l.toi / 30).toFixed(1)}m
                    <span class="cover-d">${Math.round(l.toi)}d</span>
                  </td>`;
                })()}
                <td class="r num muted">${fmt(l.m.soh)}</td>
                <td class="r num muted" title="Already ordered and not yet received">${l.m.po ? fmt(l.m.po) : '—'}</td>
                <td class="r num muted" title="Minimum stock level: lead-time cover plus safety-day cover">${l.msl ? fmt(Math.round(l.msl)) : '—'}</td>
                <td class="r num" style="font-weight:600">${fmt(qtyShown)}${d && d.kind === 'override' ? ' <span class="pill p-info">edited</span>' : ''}</td>
                <td>${weekCells(l)}</td>
                <td class="r num">${aed(qtyShown * l.m.price)}</td>
                <td class="r" style="white-space:nowrap">
                  ${!canEdit(l) ? `<span class="pill p-mute">read-only</span> <button class="btn btn-s btn-ghost" data-open="${l.m.code}">Open</button>`
                    : state.showCleared ? `<button class="btn btn-s" data-open="${l.m.code}">Trail</button>`
                    : d ? `<span class="pill ${d.kind === 'reject' ? 'p-crit' : d.kind === 'override' ? 'p-info' : 'p-good'}">${d.kind === 'accept' ? 'accepted' : d.kind === 'reject' ? 'rejected' : 'overridden'}</span>
                           <button class="btn btn-s btn-ghost" data-open="${l.m.code}">Open</button>`
                    : `<button class="btn btn-s" data-accept="${l.m.code}">Accept</button>
                       <button class="btn btn-s" data-open="${l.m.code}">Open</button>`}
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>
      </div>

      <div class="step-bar">
        ${decided < f.length ? `<button class="btn btn-p btn-lg btn-arrow step-b" id="acceptAll">Accept the remaining ${fmt(f.length - decided)}
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 10.5 8 14.5 16 6"/>
          </svg>
        </button>` : ''}
        ${decided < f.length
          ? `<button class="btn btn-s btn-ghost" id="toOrders" disabled>Create order list</button>`
          : `<button class="btn btn-p btn-lg btn-arrow step-b" id="toOrders">Create order list
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.5 10h13M11.5 5l5 5-5 5"/>
              </svg>
            </button>`}
          <div class="step-sub">
        <p class="step-n">${decided < f.length
          ? `${f.length - decided} of ${f.length} still to decide`
          : `All ${f.length} decided · ${fmt(c.length)} cleared on their own`}</p>
      </div>
        </div>
    `;
  }

  function weekCells(l) {
    if (l.m.band === 'monthly') return `<span class="wk on">single release</span>`;
    const byWeek = {};
    l.releases.forEach(r => byWeek[r.week] = r.qty);
    return `<div class="weekcell">${[1,2,3,4].map(w =>
      byWeek[w] ? `<span class="wk on" title="${WEEK_DATES[w-1]}">W${w} ${short(byWeek[w])}</span>`
                : `<span class="wk">W${w}</span>`).join('')}</div>`;
  }

  const short = n => n >= 1e6 ? (n/1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n/1e3) + 'k' : String(n);

  // ---------- DRAWER ----------
  const STOCK_GROUPS = {
    fg: { title:'Finished goods on hand', cats:null },
    rm: { title:'Raw materials on hand', cats:['Raw Material', 'Chemical'] },
    pm: { title:'Packaging material on hand', cats:['Packaging'] }
  };

  function stockRows(kind) {
    if (kind === 'fg') {
      return FG_STOCK.filter(g => g.unit === state.myUnit)
        .map(g => ({ code:g.code, desc:g.desc, uom:g.uom, qty:g.qty, value:g.qty * g.price }));
    }
    const cats = STOCK_GROUPS[kind].cats;
    return MATERIALS.filter(m => cats.includes(m.cat) && m.unit === state.myUnit)
      .map(m => ({ code:m.code, desc:m.desc, uom:m.uom, qty:m.soh, value:m.soh * m.price }));
  }

  // FR-28 and FR-30 in one place, filtered per FR-29: every requirement line
  // with the four numbers that justify it, and cover in months against its own
  // floor. Opened from the dashboard rather than replacing the review screen —
  // this is for looking, the review step is for deciding.
  const REQ_EXC = [
    { k:'', t:'All exception status' },
    { k:'cover', t:'Below cover' },
    { k:'space', t:'Quantity and space' },
    { k:'gap', t:'Data gaps' },

    $('#reqScrim').onclick = () => { state.reqOpen = false; renderReqDrawer(); };

    [['reqUnit','reqUnit'],['reqType','reqType'],['reqSupplier','reqSupplier'],['reqExc','reqExc']].forEach(([id, key]) => {

          ${(isCleared || !canEdit(l)) ? (canEdit(l) ? '' : `<div class="note"><strong>Read-only.</strong> This line belongs to ${esc(UNITS.find(u => u.code === l.m.unit)?.name || l.m.unit)}. You can see how it was worked out, but only that plant's planner can decide it.</div>`) : `

      if (kind === 'accept') {

        closeDrawer();
        return;

      recordDecision(l.m.code, { kind, reason: cur.reason, qty: cur.qty != null ? cur.qty : l.prQty });
      renderDrawer();
      updateDelta();

    const sel = $('#rcSel');
    if (sel) sel.onchange = () => {

      if (cur.reason) { render(); }
    };

    const ov = $('#ovQty');
    if (ov) { ov.oninput = () => { const cur = state.decisions[l.m.code]; if (cur) cur.qty = +ov.value; updateDelta(); }; updateDelta(); }

    function updateDelta() {
      const box = $('#ovDelta'); if (!box) return;
      const cur = state.decisions[l.m.code];
      const q = cur && cur.qty != null ? cur.qty : l.prQty;
      const dq = q - l.prQty, dv = dq * l.m.price;
      box.innerHTML = dq === 0 ? 'Same as the suggestion.' :
        `<span style="color:${dq > 0 ? 'var(--flag)' : 'var(--accent)'};font-weight:600">${dq > 0 ? '+' : ''}${fmt(dq)} ${esc(l.m.uom)}</span> against the suggested ${fmt(l.prQty)} · ${dv > 0 ? '+' : ''}${aed(dv)}`;
    }

    document.addEventListener('keydown', escClose);
  }

  function escClose(e) { if (e.key === 'Escape') closeDrawer(); }
  function closeDrawer() {
    state.drawer = null;
    document.removeEventListener('keydown', escClose);
    render();
  }

  // ---------- STEP 4 ----------
  function viewOrders() {
    const orders = buildOrders();
    const byUnit = {};
    orders.forEach(o => (byUnit[o.l.m.unit] = byUnit[o.l.m.unit] || []).push(o));
    const total = orders.reduce((a, o) => a + o.qty * o.l.m.price, 0);
    const weekTotals = [1,2,3,4].map(w => orders.reduce((a, o) => {
      const rel = o.l.m.band === 'monthly' ? (w === 1 ? o.qty : 0) : (o.l.releases.find(r => r.week === w)?.qty || 0) * (o.qty / (o.l.prQty || 1));
      return a + rel * o.l.m.price;
    }, 0));

    return `
      <div class="head">
        <div>
          <h2>Order list — ${esc(myName())}</h2>
          <p>Approved requirement by unit and by week. Every line carries the decision and the reason behind it.</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="v">${fmt(orders.length)}</div><div class="k label">Order lines</div></div>
        <div class="stat"><div class="v">${aedM(total)}</div><div class="k label">Total value</div></div>
        <div class="stat"><div class="v">${fmt(Object.keys(byUnit).length)}</div><div class="k label">Units</div></div>
        <div class="stat"><div class="v">${fmt(Object.values(state.decisions).filter(d => d.kind === 'reject').length)}</div><div class="k label">Rejected</div><div class="d">Not carried forward</div></div>
      </div>

      <div class="panel">
        <div class="panel-h"><div><h3>By week</h3><p>Weekly-band materials are called off against warehouse pallet space; monthly band releases once.</p></div></div>
        <div class="panel-b" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
          ${weekTotals.map((v, i) => `<div>
            <div class="label">Week ${i + 1} · ${WEEK_DATES[i]}</div>
            <div class="num" style="font-size:17px;font-weight:600;margin-top:2px">${aedM(v)}</div>
            <div class="bar" style="margin-top:5px"><i style="width:${Math.max(2, (v / Math.max(...weekTotals, 1)) * 100)}%"></i></div>
          </div>`).join('')}
        </div>
      </div>

      ${Object.entries(byUnit).sort().map(([u, rows]) => `
        <div class="panel">
          <div class="panel-h">
            <div><h3>${u} — ${esc(UNITS.find(x => x.code === u)?.name || '')}</h3><p>${rows.length} lines · ${aed(rows.reduce((a, o) => a + o.qty * o.l.m.price, 0))}</p></div>
          </div>
          <div class="scroll"><table>
            <thead><tr><th>Material</th><th>Band</th><th class="r">Suggested</th><th class="r">Approved</th><th>Schedule</th><th class="r">Value</th><th>Decision</th></tr></thead>
            <tbody>${rows.map(o => `<tr>
              <td><div class="cell-code">${esc(o.l.m.code)}</div><div class="cell-desc">${esc(o.l.m.desc)}</div></td>
              <td>${o.l.m.band === 'weekly' ? '<span class="pill p-info">weekly</span>' : '<span class="pill p-mute">monthly</span>'}</td>
              <td class="r num muted">${fmt(o.l.prQty)}</td>
              <td class="r num" style="font-weight:600">${fmt(o.qty)}</td>
              <td>${weekCells(o.l)}</td>
              <td class="r num">${aed(o.qty * o.l.m.price)}</td>
              <td>${o.d.kind === 'override'
                    ? `<span class="pill p-info">changed</span> <span class="muted" style="font-size:11px">${esc(o.d.reason || '')}</span>`
                    : `<span class="pill p-good">accepted</span>${o.auto ? ' <span class="muted" style="font-size:11px">cleared automatically</span>' : ''}`}</td>
            </tr>`).join('')}</tbody>
          </table></div>
        </div>`).join('')}

      <div style="margin-top:16px" class="note note-flag">
        <strong>Writing back to D365 is Phase 2.</strong> Save and update are shown here end to end so the flow can be agreed, but nothing leaves the browser — the reference is generated locally. In Phase 1 as it stands today, these demand orders are exported and handed to the warehouse team, who raise the PR by hand.
      </div>

      <div class="step-bar">
        <button class="btn btn-p btn-lg btn-arrow step-b" id="saveD365" ${state.d365 && !d365Dirty() ? 'disabled' : ''}>
          ${state.d365 ? (d365Dirty() ? 'Update in D365' : 'Saved to D365') : 'Save to D365'}
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

              ? '<path d="M4 10.5 8 14.5 16 6"/>'
              : '<path d="M4 13v2.5a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5V13"/><path d="M10 3v9M6.5 8.5 10 12l3.5-3.5"/>'}

  // A fingerprint of the order list exactly as it stands: every line, quantity,
  // week and decision. Comparing it against what was written is what separates
  // "already saved" from "saved, then changed" — a line count alone would miss
  // a quantity edit that leaves the count the same.
  function orderSignature(orders) {
    return orders.map(o => {
      const rel = o.l.m.band === 'monthly' ? [{ week:1, qty:o.qty }] : o.l.releases;
      return [o.l.m.code, o.qty, o.d.kind, o.d.reason || '', rel.map(r => r.week + ':' + r.qty).join('|')].join('~');
    }).sort().join(';');
  }

  const d365Dirty = () => !!state.d365 && state.d365.sig !== orderSignature(buildOrders());

  // Phase 2 capability, shown here end to end. Nothing leaves the browser — the
  // reference is generated locally, so this demonstrates the flow and the states
  // around it, not a live Dynamics write.
  function saveToD365() {
    const orders = buildOrders();
    if (!orders.length) return;
    const updating = !!state.d365;
    state.fcLoading = {
      t0: Date.now(), total: 1300,
      msg: `${updating ? 'Updating' : 'Writing'} ${fmt(orders.length)} lines in Dynamics 365`
    };
    render();
    setTimeout(() => {
      const now = new Date();
      state.d365 = {
        ref: state.d365 ? state.d365.ref : `PR-${state.myUnit}-2609-${String(1 + (state.d365Seq = (state.d365Seq || 0) + 1)).padStart(4, '0')}`,
        at: now,
        sig: orderSignature(orders),
        count: orders.length,
        version: state.d365 ? state.d365.version + 1 : 1
      };
      state.fcLoading = null;
      archiveCycle();
      render();
    }, 1300);
  }

  // A closed cycle is the record of what was actually ordered, and it has to
  // outlive the tab — the questions it answers ("which forecast drove the
  // August plan?", "what did we order last month?") are asked weeks later.
  //
  // localStorage stands in for the database this belongs in. It is enough to
  // demonstrate the behaviour and explicitly not enough for an audit record:
  // it is per-browser, per-machine, and a cache clear takes it with it.
  // Admin change log. Deliberately narrow: the three things an admin can do
  // that move numbers for everyone — edit a calculation rule, move a threshold,
  // override a planning parameter. Navigation and screen opens are not logged,
  // because burying three consequential changes under a thousand harmless ones
  // is the same as not logging them.
  //
  // Scope is the field that matters: a planner's override moves one line, an
  // admin's rule change moves every line at every plant, and only the second
  // one is invisible today.
  const AUDIT_KEY = 'agf-mrp.audit';

  // are kept out of state.audit deliberately: nothing seeded is ever written to
  // storage, so a real change can never be confused for one of these. Each row
  // is marked in the table.
