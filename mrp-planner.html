  // Seeded first, then anything recorded in this browser, oldest to newest.
  const auditRows = () => [...SEED_AUDIT, ...state.audit].sort((a, b) => new Date(a.at) - new Date(b.at));

  function saveAudit() {
    try { localStorage.setItem(AUDIT_KEY, JSON.stringify(state.audit)); } catch (e) { /* private mode */ }
  }
  function loadAudit() {
    try {
      const raw = JSON.parse(localStorage.getItem(AUDIT_KEY) || '[]');
      state.audit = raw.map(a => ({ ...a, at: new Date(a.at) }));
    } catch (e) { state.audit = []; }
  }

  function logChange(kind, what, from, to, scope) {
    // Nothing is recorded when the value did not actually move — an onchange
    // that fires with the same number is not a change anyone needs to read.
    if (String(from) === String(to)) return;
    state.audit.push({
      at: new Date(), who: USER.name, role: isAdmin() ? ROLES.admin : ROLES.planner,
      unit: state.myUnit, kind, what, from: String(from), to: String(to), scope
    });
    saveAudit();
  }

  const CYCLE_KEY = 'agf-mrp.cycles';

  function saveCycles() {
    try { localStorage.setItem(CYCLE_KEY, JSON.stringify(state.cycles)); } catch (e) { /* private mode */ }
  }
  function loadCycles() {
    try {
      const raw = JSON.parse(localStorage.getItem(CYCLE_KEY) || '[]');
      // Dates come back as strings; revive them so every screen can format them.
      state.cycles = raw.map(c => ({ ...c, closedAt: new Date(c.closedAt) }));
    } catch (e) { state.cycles = []; }
  }

  // Snapshot of the cycle as it stands: what came in, what the engine did with
  // it, what was decided and what was sent on. Written when the plan is saved,
  // and rewritten in place if it is saved again.
  function archiveCycle() {
    const orders = buildOrders();
    if (!orders.length) return;
    const v = currentVersion();
    const rec = {
      id: `${state.myUnit}-${state.d365 ? state.d365.ref : 'local'}`,
      unit: state.myUnit, unitName: myName(), cycle: 'September 2026',
      closedAt: new Date(),
      fcVersion: state.run ? state.run.fcVersion : state.forecastVersion,
      fcFile: v ? v.file : null,
      runNo: state.run ? state.run.no : null,
      pr: state.d365 ? state.d365.ref : null,
      prVersion: state.d365 ? state.d365.version : null,
      lines: orders.length,
      value: orders.reduce((a, o) => a + o.qty * o.l.m.price, 0),
      decided: orders.filter(o => !o.auto).length,
      auto: orders.filter(o => o.auto).length,
      rows: orders.map(o => ({
        code: o.l.m.code, desc: o.l.m.desc, uom: o.l.m.uom, band: o.l.m.band,
        qty: o.qty, value: o.qty * o.l.m.price,
        decision: o.d.kind, reason: o.d.reason || ''
      }))
    };
    const i = state.cycles.findIndex(c => c.id === rec.id);
    if (i >= 0) state.cycles[i] = rec; else state.cycles.push(rec);
    saveCycles();
  }

  function buildOrders() {
    const out = [];
    (state.lines || []).forEach(l => {
      if (l.excluded || l.prQty <= 0) return;
      if (l.m.unit !== state.myUnit) return;   // he only raises orders for his own plant
      const isFlagged = l.exceptions.length > 0;
      const d = state.decisions[l.m.code];
      if (isFlagged) {
        if (!d || d.kind === 'reject') return;
        out.push({ l, d, qty: d.kind === 'override' ? d.qty : l.prQty, auto:false });
      } else {
        out.push({ l, d:{ kind:'accept' }, qty: l.prQty, auto:true });
      }
    });
    return out;
  }

  function exportCsv() {
    const rows = [['Unit','Material code','Description','UOM','Band','Suggested qty','Approved qty','Unit cost AED','Value AED','Week','Week qty','Decision','Reason code']];
    buildOrders().forEach(o => {
      const rel = o.l.m.band === 'monthly' ? [{ week:1, qty:o.qty }] : o.l.releases;
      rel.forEach(r => rows.push([
        o.l.m.unit, o.l.m.code, o.l.m.desc, o.l.m.uom, o.l.m.band,
        o.l.prQty, o.qty, o.l.m.price, (o.qty * o.l.m.price).toFixed(2),
        'W' + r.week, r.qty, o.d.kind, o.d.reason || ''
      ]));
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'demand-orders-sep-2026.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // The three quantity columns are whatever the file called them, so the
  // headings come from the mapping rather than from a hardcoded Sep/Oct/Nov.
  // Two forms: the source name, which is what an export must carry if the file
  // is to map itself on the way back in, and a short label for the screen.
  //   "FC Qty MT Sep-2026" -> source, and "Sep 2026" to read.
  function monthCols() {
    const map = state.map || {};
    return ['m0', 'm1', 'm2'].map((k, i) => {
      const src = map[k] || `Month ${i + 1}`;
      const m = /([A-Za-z]{3,9})[-\s]?(\d{4})/.exec(src);
      const pretty = m ? `${m[1].slice(0, 3)} ${m[2]}` : src;
      return { src, pretty };
    });
  }

  // Full CSV, not a split on commas: the real file carries item descriptions
  // with commas in them and quantities quoted as "1,240", either of which
  // silently shifts every column after it on a naive parse. Handles quoted
  // fields, escaped quotes, and CR/LF or LF line endings.
  function parseCsv(text) {
    const rows = [];
    let row = [], cell = '', quoted = false;
    const t = text.replace(/^\uFEFF/, '');           // strip a BOM if Excel left one
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (quoted) {
        if (ch === '"') {
          if (t[i + 1] === '"') { cell += '"'; i++; } else quoted = false;
        } else cell += ch;
        continue;
      }
      if (ch === '"') { quoted = true; continue; }
      if (ch === ',') { row.push(cell); cell = ''; continue; }
      if (ch === '\r') continue;
      if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; continue; }
      cell += ch;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim() !== ''));
  }

  // The live workbook puts its header on row 12, and an export may or may not
  // keep the preamble above it. Rather than assume a row number, take the row
  // in the first 25 with the most non-empty cells — the header is the widest
  // row in any sheet shaped like this one.
  function findHeaderRow(rows) {
    let best = 0, bestCount = 0;
    rows.slice(0, 25).forEach((r, i) => {
      const count = r.filter(c => String(c).trim() !== '').length;
      if (count > bestCount) { bestCount = count; best = i; }
    });
    return best;
  }

  // Take parsed rows into the mapping step: name the columns, key each row by
  // its header, then let the usual remembered-or-guessed mapping run.
  function ingestCsv(name, text) {
    const grid = parseCsv(text);
    if (grid.length < 2) { state.fcError = 'That file has no rows in it.'; render(); return; }
    const h = findHeaderRow(grid);
    state.headerRow = h + 1;      // 1-based, as a spreadsheet counts
    const headers = grid[h].map((c, i) => String(c).trim() || `Column ${i + 1}`);
    const raw = grid.slice(h + 1).map(r => {
      const o = {};
      headers.forEach((k, i) => { o[k] = r[i] == null ? '' : String(r[i]).trim(); });
      return o;
    });
    state.fcError = null;
    state.fileName = name;
    state.raw = raw;
    state.headers = headers;
    const lm = loadMapping(headers, raw);
    state.map = lm.map;
    state.remembered = lm.remembered;
    state.forecast = null;      // a new file replaces whatever was accepted
    state.fcShowMap = false;
    state.fcLoading = null;
    render();
    window.scrollTo(0, 0);
  }

  function readForecastFile(file) {
    if (!file) return;
    if (/\.xlsx?$/i.test(file.name)) {
      state.fcError = `${file.name} is an Excel file. Save it as CSV from the Rolling FC sheet and drop it again.`;
      render();
      return;
    }
    state.fcLoading = { t0: Date.now(), total: 600, msg: `Reading ${file.name}` };
    render();
    const fr = new FileReader();
    fr.onload = () => setTimeout(() => ingestCsv(file.name, String(fr.result)), 350);
    fr.onerror = () => { state.fcLoading = null; state.fcError = 'That file could not be read.'; render(); };
    fr.readAsText(file);
  }

  // The accepted forecast, back out as a file — the version that has been
  // mapped, corrected and had its bad rows removed, which is not what Sales
  // sent and is what everything downstream actually used.
  function downloadForecastCsv() {
    if (!state.forecast) return;
    // Source column names, not the pretty ones: this is what lets the file be
    // dropped straight back in and map itself without touching a dropdown.
    const rows = [['Item Code', 'Item Description', 'BU', 'UOM', ...monthCols().map(c => c.src)]];
    state.forecast.forEach(f => rows.push([f.fg, f.desc || '', f.unit, f.uom, f.m0, f.m1, f.m2]));
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'FG-Forecast-Sep-Nov-2026-verified.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // The forecast file as Sales actually send it — all 22 columns in their real
  // order, header row included, awkward rows and all. Downloading it is the
  // only way to see what the mapping step is up against without opening the
  // live workbook, and it gives anyone testing a file to edit and re-upload.
  function downloadSampleCsv() {
    const rows = [RAW_HEADERS.slice(), ...rawRows().map(r => RAW_HEADERS.map(h => r[h] == null ? '' : r[h]))];
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type:'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'FG-Forecast-Sep-Nov-2026-sample.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ===================================================================
  // WIRING
  // ===================================================================
  function wire() {
    document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => go(+b.dataset.step));

    const hero = $('#heroCta');
    if (hero) hero.onclick = () => { const cs = cycleState(); state.maxStep = Math.max(state.maxStep, cs.step); go(cs.step); };

    document.querySelectorAll('[data-map]').forEach(sel => sel.onchange = () => {
      state.map = { ...(state.map || {}), [sel.dataset.map]: sel.value || undefined };
      state.remembered = false;
      render();
    });

    const acc = $('#acceptFc');
    if (acc) acc.onclick = () => {
      const rows = validateRows(state.raw, state.map).filter(r => r.data).map(r => r.data);
      state.fcLoading = { t0: Date.now(), total: 900, msg: `Verifying ${fmt(rows.length)} rows` };
      render();
      setTimeout(() => {
        saveMapping(state.map);
        const res = validateRows(state.raw, state.map);
        const count = o => res.filter(r => r.out === o).length;
        const n = nextVersionNo();
        state.versions.push({
          n, file: state.fileName || 'Untitled.csv', at: new Date(), rows,
          outcomes: { loaded: count('loaded'), corrected: count('corrected'),
                      warning: count('warning'), quarantined: count('quarantined') }
        });
        state.forecastVersion = n;
        state.forecast = rows;
        state.fcShowMap = false;          // the verified table takes the screen
        state.maxStep = Math.max(state.maxStep, STEP_ITEMS);
        state.fcLoading = null;
        render();
        window.scrollTo(0, 0);
      }, 900);
    };

    // Both the step-bar link and the × on the file block do the same thing, so
    // the rule about locked versions lives in one place rather than two.
    const clearWorkingFile = () => {
      // The working file is cleared either way. What survives is the accepted
      // version: once a completed run has used it, it stays as the current
      // forecast until a newer one is accepted, so the run never ends up
      // pointing at a version that no longer exists.
      const locked = versionLocked(state.forecastVersion);
      state.raw = null;
      state.headers = [];
      state.map = null;
      state.remembered = false;
      state.fileName = locked ? state.fileName : null;
      state.fcShowMap = false;
      state.fcError = null;
      if (!locked) { state.forecast = null; state.forecastVersion = null; }
      render();
      window.scrollTo(0, 0);
    };

    const reup = $('#fcReupload'); if (reup) reup.onclick = clearWorkingFile;
    const rem = $('#fcRemove');    if (rem)  rem.onclick  = clearWorkingFile;

    // Accepts every flagged line still waiting — the engine's own quantity, on
    // the lines the planner has not chosen to change. Each still lands as its
    // own decision, so the order list and the trail read the same as if they
    // had been accepted one by one.
    const accAll = $('#acceptAll');
    if (accAll) accAll.onclick = () => {
      flagged().forEach(l => { if (!state.decisions[l.m.code]) recordDecision(l.m.code, { kind:'accept' }); });
      render();
    };

    const back = $('#fcBack');
    if (back) back.onclick = () => { state.fcShowMap = true; render(); window.scrollTo(0, 0); };

    const fcFile = $('#fcFile');
    const pick = $('#pickFile');
    if (pick && fcFile) pick.onclick = () => fcFile.click();
    if (fcFile) fcFile.onchange = () => { readForecastFile(fcFile.files && fcFile.files[0]); fcFile.value = ''; };

    const dlFc = $('#dlForecast'); if (dlFc) dlFc.onclick = downloadForecastCsv;

    const drop = $('#drop');
    if (drop) {
      drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
      drop.ondragleave = () => drop.classList.remove('over');
      // A dropped file is read for real. A drop carrying no file does nothing —
      // there is no sample to fall back to any more.
      drop.ondrop = e => {
        e.preventDefault();
        drop.classList.remove('over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) readForecastFile(f);
      };
    }

    const toRun = $('#toRun'); if (toRun) toRun.onclick = () => { state.maxStep = Math.max(state.maxStep, STEP_ITEMS); go(STEP_ITEMS); };
    const toRun2 = $('#toRun2'); if (toRun2) toRun2.onclick = () => { state.maxStep = Math.max(state.maxStep, STEP_RUN); go(STEP_RUN); };

    const imSearch = $('#imSearch');
    if (imSearch) imSearch.oninput = () => {
      state.imFilter = imSearch.value;
      render();
      const el = $('#imSearch');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    };
    const imGaps = $('#imGaps'); if (imGaps) imGaps.onclick = () => { state.imGapsOnly = !state.imGapsOnly; render(); };

    // Assigning a rule to a material is master data, so it is admin-only.
    document.querySelectorAll('[data-logic]').forEach(sel => sel.onchange = () => {
      if (!isAdmin()) return;
      const code = sel.dataset.logic;
      state.customRules = state.customRules.filter(r => !(r.scope === 'material' && r.target === code));
      const chosen = state.customRules.concat(Object.values(PREDEF)).find(r => r.id === sel.value);
      if (chosen && !chosen.built) {
        state.customRules.push({ ...chosen, scope:'material', target:code, id:chosen.id });
      }
      if (state.lines) recalc();
      render();
    });

    document.querySelectorAll('.cell-in').forEach(inp => inp.onchange = () => {
      const m = MATERIALS.find(x => x.code === inp.dataset.code);
      if (!m) return;
      const v = inp.value === '' ? null : Number(inp.value);
      const field = { lt:'Lead time', safety:'Safety days', moq:'MOQ', bundle:'Bundle size', price:'Price' }[inp.dataset.p] || inp.dataset.p;
      logChange('parameter', `${field} · ${m.code}`, m[inp.dataset.p] == null ? 'not set' : m[inp.dataset.p],
        v == null ? 'not set' : v, `1 material · ${esc(m.desc)}`);
      m[inp.dataset.p] = v;           // local override; the D365 value is kept alongside
      if (state.lines) recalc();
      render();
    });

    const trig = $('#pTrigger');
    if (trig) trig.onchange = () => { state.pTrigger = trig.value; render(); };


    const startSim = $('#startSim');
    if (startSim) startSim.onclick = () => { state.simulate = true; $('#startRun').click(); };

    const start = $('#startRun');
    if (start) start.onclick = e => {
      if (e && e.isTrusted) state.simulate = false;   // a real click on Generate is a live run
      state.wasSimulation = false;
      state.runNo += 1;
      state.run = {
        // Stamped at start, never re-read: this is the record of what the run
        // used, not a live pointer at whatever is current now.
        fcVersion: state.forecastVersion,
        no: state.runNo,
        t0: Date.now(), total: 6000, done: false,
        stages: ['Reading stock on hand', 'Reading open purchase orders', 'Building consumption trend',
                 'Exploding BOM for one-to-one materials', 'Applying MOQ and bundle rounding', 'Building supply schedule']
      };
      state.timer = setInterval(() => {
        if (Date.now() - state.run.t0 >= state.run.total) {
          clearInterval(state.timer); state.timer = null;
          state.run.done = true;
          state.run.t1 = Date.now();   // read by the MRP completion time metric
          const used = state.versions.find(v => v.n === state.run.fcVersion);
          if (used && !used.usedBy) used.usedBy = state.run.no;
          const byFg = {};
          (state.forecast || FORECAST).forEach(f => byFg[f.fg] = f);
          state.lines = MATERIALS.map(m => calculate(m, m.fg ? byFg[m.fg] : null));
          state.maxStep = Math.max(state.maxStep, STEP_REVIEW);
          // Straight to the lines that need a decision — the run summary was a
          // screen whose only purpose was a button to this one.
          state.step = STEP_REVIEW;
          render();
          window.scrollTo(0, 0);
          return;
        }
        if (state.step === STEP_RUN) render();
      }, 120);
      render();
    };

    const toReview = $('#toReview'); if (toReview) toReview.onclick = () => go(STEP_REVIEW);
    const toOrders = $('#toOrders'); if (toOrders) toOrders.onclick = () => { state.maxStep = Math.max(state.maxStep, STEP_ORDERS); go(STEP_ORDERS); };

    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.showCleared = false; state.showOthers = false; render(); });
    document.querySelectorAll('[data-cleared]').forEach(b => b.onclick = () => { state.showCleared = !state.showCleared; state.showOthers = false; render(); });
    document.querySelectorAll('[data-others]').forEach(b => b.onclick = () => { state.showOthers = !state.showOthers; state.showCleared = false; render(); });
    document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { state.drawer = b.dataset.open; renderDrawer(); });
    document.querySelectorAll('[data-accept]').forEach(b => b.onclick = () => {
      if (recordDecision(b.dataset.accept, { kind:'accept' })) render();
    });

    document.querySelectorAll('[data-audit-kind]').forEach(b => b.onclick = () => {
      state.auditKind = b.dataset.auditKind || '';
      render();
    });

    document.querySelectorAll('[data-cycle]').forEach(b => b.onclick = () => { state.accCycle = +b.dataset.cycle; render(); });
    document.querySelectorAll('[data-settings]').forEach(b => b.onclick = () => {
      const want = b.dataset.settings;
      state.settings = want === 'auto' ? (settingsTabs()[0] || { k:'units' }).k : want;
      go(PAGE_SETTINGS);
    });
    document.querySelectorAll('[data-settab]').forEach(b => b.onclick = () => { state.settings = b.dataset.settab; render(); window.scrollTo(0, 0); });
    document.querySelectorAll('[data-open-stock]').forEach(b => b.onclick = () => { state.stockDrawer = b.dataset.openStock; renderStockDrawer(); });
    document.querySelectorAll('[data-goto-forecast]').forEach(b => b.onclick = () => { state.maxStep = Math.max(state.maxStep, STEP_FORECAST); go(STEP_FORECAST); });
    document.querySelectorAll('[data-goto-items]').forEach(b => b.onclick = () => { state.maxStep = Math.max(state.maxStep, STEP_ITEMS); go(STEP_ITEMS); });
    document.querySelectorAll('[data-goto-review]').forEach(b => b.onclick = () => { state.maxStep = Math.max(state.maxStep, STEP_REVIEW); go(STEP_REVIEW); });
    document.querySelectorAll('[data-req-lines]').forEach(b => b.onclick = () => { state.reqOpen = true; renderReqDrawer(); });

    if (state.step === PAGE_SETTINGS) wireSettings();

    wireProfile();

    document.querySelectorAll('[data-cycle]').forEach(b => b.onclick = () => {
      state.openCycle = state.openCycle === b.dataset.cycle ? null : b.dataset.cycle;
      render();
    });

    const ru = $('#reviewUnit');
    if (ru) ru.onchange = () => { state.reviewUnit = ru.value; render(); };

    const ca = $('#cmpA'), cb = $('#cmpB');
    if (ca) ca.onchange = () => { state.cmpA = ca.value; render(); };
    if (cb) cb.onchange = () => { state.cmpB = cb.value; render(); };

    const rn = $('#railNotif');
    if (rn) rn.onclick = e => {
      e.stopPropagation();
      state.notifOpen = !state.notifOpen;
      state.menuOpen = false;          // one panel open at a time in the rail
      render();
    };
    const np = $('#notifPanel');
    if (np) {
      np.onclick = e => e.stopPropagation();
      np.querySelectorAll('[data-notif-step]').forEach(x => x.onclick = () => {
        const n = +x.dataset.notifStep;
        state.notifOpen = false;
        state.maxStep = Math.max(state.maxStep, n);
        go(n);
      });
    }

    const rt = $('#railTheme');
    if (rt) rt.onclick = e => {
      e.stopPropagation();
      const i = THEMES.findIndex(t => t.k === state.theme);
      applyTheme(THEMES[(i + 1) % THEMES.length].k);
      render();
    };

    const rs = $('#railSettings');
    if (rs) rs.onclick = e => {
      e.stopPropagation();
      if (state.step === PAGE_SETTINGS) { go(0); return; }   // second press goes back
      if (!state.settings) state.settings = (settingsTabs()[0] || { k:'units' }).k;
      go(PAGE_SETTINGS);
    };

    const ex = $('#exportCsv'); if (ex) ex.onclick = exportCsv;
    const d3 = $('#saveD365'); if (d3) d3.onclick = saveToD365;
    const sc = $('#sampleCsv'); if (sc) sc.onclick = downloadSampleCsv;
  }

  // The menu is re-rendered with the page, so it is re-wired on every pass.
  function wireProfile() {
    const btn = $('#profileBtn'), menu = $('#profileMenu');
    if (!btn || !menu) return;

    btn.onclick = e => {
      e.stopPropagation();
      state.menuOpen = !state.menuOpen;
      menu.classList.toggle('hide', !state.menuOpen);
      btn.setAttribute('aria-expanded', String(state.menuOpen));
    };
    menu.onclick = e => e.stopPropagation();

    const pick = $('#unitPick');
    if (pick) pick.onchange = () => {
      state.myUnit = pick.value;
      state.decisions = {};
      const first = MATERIALS.find(x => x.unit === state.myUnit && inScope(x));
      if (first) state.sampleCode = first.code;
      state.menuOpen = false;
      syncStock();                       // a different plant is a different fetch
      if (state.lines) recalc(); else render();
    };

    const rolePick = $('#rolePick');
    if (rolePick) rolePick.onchange = () => {
      state.roles = rolePick.value.split(',');
      if (state.settings && !settingsTabs().some(t => t.k === state.settings)) {
        state.settings = (settingsTabs()[0] || { k:'units' }).k;
      }
      state.menuOpen = false;
      render();
      render();
    };

    // The menu stays open — switching theme is something you check the result
    // of, and closing the panel would hide half of what you just changed.
    menu.querySelectorAll('[data-settings]').forEach(x => x.onclick = () => {
      state.menuOpen = false;
      const want = x.dataset.settings;
      state.settings = want === 'auto' ? (settingsTabs()[0] || { k:'units' }).k : want;
      go(PAGE_SETTINGS);
    });
  }

  document.addEventListener('click', () => {
    if (state.notifOpen) { state.notifOpen = false; render(); return; }
    if (!state.menuOpen) return;
    state.menuOpen = false;
    const menu = $('#profileMenu'), btn = $('#profileBtn');
    if (menu) menu.classList.add('hide');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (state.notifOpen) { state.notifOpen = false; render(); return; }
    if (state.stockDrawer) { closeStockDrawer(); return; }
    if (state.menuOpen) { state.menuOpen = false; render(); }
  });

  // Stands in for the stock/open-order fetch. Cleared once, on boot; switching
  // plant re-arms it, because that is the other moment the figures are refetched.
  const SYNC_MS = 900;
  function syncStock() {
    state.loading = true;
    setTimeout(() => { state.loading = false; render(); }, SYNC_MS);
  }

  loadTheme();
  loadCycles();
  loadAudit();
  syncStock();
  render();
})();
</script>
